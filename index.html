/* Keep the original palette and pixel world; extend the controller and learning UI. */
#shell{padding:10px max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left));}
#gameFrame{width:min(100%,1100px);}
#hud{padding:10px 12px;flex-wrap:wrap;gap:5px;}
.hud-left{max-width:68%;min-width:0;flex:1;}
.hud-right{flex-wrap:wrap;justify-content:flex-end;max-width:30%;}
.hud-button{min-height:36px;}
#hudPower{width:100%;font:10px/1.3 monospace;color:#a7f0d4;padding-left:3px;}
#hudXP{font-size:11px;}
#controls{display:flex!important;bottom:8px;padding:0 14px;align-items:center;}
#controls.hidden{display:none!important;}
.dpad,.action-pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,36px);gap:2px;}
.touch-btn{width:44px;height:36px;min-height:0;font-size:20px;border-width:2px;border-radius:7px;box-shadow:inset 0 2px #ffffff25;}
.dpad .up{grid-area:1/2}.dpad .left{grid-area:2/1}.dpad .down{grid-area:3/2}.dpad .right{grid-area:2/3}
.dpad .center{grid-area:2/2;display:grid;place-items:center;font:10px monospace;color:#9dc9dd;background:#13243aa6;border-radius:4px;}
.action-pad .power{grid-area:1/2;background:#416954;}.action-pad .fire{grid-area:2/3;background:#945a55;}.action-pad .act{grid-area:2/1;background:#77613fc9;}.action-pad .jump{grid-area:3/2;background:#31658d;}
.touch-btn small{display:block;font:8px/1 monospace;margin-top:1px;}.touch-btn.act{font-size:17px;}
.touch-btn.ready{border-color:#9ce9c3;box-shadow:inset 0 2px #ffffff25,0 0 8px #9ce9c344;}
.controller-meta{pointer-events:auto;display:flex;flex-direction:column;gap:5px;width:100px;text-align:center;}
.controller-meta button{background:#21374adf;border:2px solid #72a7b7;font:10px monospace;padding:6px 3px;min-height:32px;}
.controller-meta button:disabled{opacity:.8;color:#f0dfaf;cursor:default;}
#gearBtn{color:#b9f6d8;}
#aimHint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font:10px monospace;color:#ddedff;z-index:2;pointer-events:none;white-space:nowrap;}
#aimHint.hidden{display:none;}
#help{display:none;}
#speech{bottom:127px;}
#rotateHint{display:none!important;}
#saveNotice{position:absolute;z-index:10;bottom:0;left:0;right:0;background:#8a5943;padding:5px;text-align:center;font-size:11px;}
#saveNotice.hidden{display:none;}
.gear-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left;margin:12px 0;}
.gear-tile{border:2px solid #648da3;background:#213952;padding:11px;display:flex;flex-direction:column;gap:7px;color:#e2edf9;min-height:126px;text-align:left;}
.gear-tile strong{font:12px monospace;color:#ffe2a3;}.gear-tile span{font-size:12px;line-height:1.4;}.gear-tile small{font:10px monospace;color:#9af2cf;}
.gear-tile.locked{filter:grayscale(1);opacity:.45;}.gear-tile.equipped{border-color:#8cf0ce;background:#254b55;}
.pipe-grid{display:grid;grid-template-columns:repeat(3,68px);gap:5px;justify-content:center;margin:10px auto;}
.pipe{position:relative;width:68px;height:68px;font:54px/1 monospace;background:#263e56;color:#94eadb;border:2px solid #779bac;padding:0;}
.pipe small{position:absolute;top:2px;left:3px;font:9px monospace;color:#ffe29b;}
.circuit-labels{display:flex;justify-content:space-between;gap:10px;font:10px monospace;color:#ffe1a3;}
.science-card{background:#21364e;border:2px solid #57849b;padding:12px;margin:12px 0;text-align:left;line-height:1.45;}
.science-card h3{font:15px monospace;color:#ffe098;margin:0 0 9px;}
.equation{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;padding:10px 5px;background:#12253b;font:bold 18px monospace;margin:8px 0;}
.equation span{color:#93ecd2;}.equation .heat{color:#ffba8c;}.equation .work{color:#95dff4;}
.variable-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.variable{border-left:3px solid #85d9d5;padding:5px 8px;background:#263e59;font-size:12px;}

.science-card .example{color:#aaf5ce;}
.key-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0;}
.key-grid button{font-size:12px;min-height:44px;}
.version-chip{position:absolute;right:7px;bottom:3px;z-index:8;font:8px monospace;color:#a6bdd6;pointer-events:none;}

<body>
<div id="shell"><div id="gameFrame">
<div id="worldView"><canvas id="gameCanvas" width="960" height="540" aria-label="Entropy Quest game world"></canvas></div>
<div id="briefing">
<div id="hud" class="hidden"><div class="hud-left"><div class="hud-title" id="hudTitle"></div><div class="hud-quest" id="hudQuest"></div></div><div class="hud-right"><span class="hud-pill" id="hudXP"></span><button class="hud-button" id="soundBtn" aria-label="Mute sound">🔊</button><button class="hud-button" id="whyBtn" aria-label="Explain this world's science">💡 WHY</button><button class="hud-button" id="journalBtn" aria-label="Open science journal">▤</button><button class="hud-button" id="pauseBtn" aria-label="Pause game">☰ MENU</button></div><div id="hudPower"></div></div>
<div id="guidanceDock">
<div id="speech" class="hidden" role="dialog" aria-label="Character dialogue"><div id="speechFace">✦</div><div id="speechBody"><div id="speechSpeaker">PIP</div><div id="speechText"></div><div id="speechNext">TAP TO CONTINUE ▾</div></div></div>
<div id="toast" class="hidden" role="status"></div>
<div id="tutorialTip" class="hidden" role="status"></div></div></div>
<div id="overlay"></div>
<div id="controllerDock">
<div id="controls" class="hidden" aria-label="Game controller"><div class="dpad"><button class="touch-btn up" data-control="up" aria-label="Aim up">▲</button><button class="touch-btn left" data-control="left" aria-label="Move left">◀</button><div class="center" id="aimReadout">0°</div><button class="touch-btn right" data-control="right" aria-label="Move right">▶</button><button class="touch-btn down" data-control="down" aria-label="Aim down">▼</button></div><div class="controller-meta"><button id="toolBtn" aria-label="Switch shot type">HEAT q</button><button id="gearBtn" aria-label="Explain or choose a power">Y? POWER INFO</button><div id="contextHint"></div></div><div class="action-pad"><button class="touch-btn power" data-control="power" id="powerControl" aria-label="Activate suit power">Y<small id="powerLabel">MAGNET</small></button><button class="touch-btn act" data-control="act" aria-label="Use nearby object">X<small id="actLabel">USE</small></button><button class="touch-btn fire" data-control="fire" aria-label="Fire or throw">B<small id="fireLabel">SHOOT</small></button><button class="touch-btn jump" data-control="jump" aria-label="Jump">A<small>JUMP</small></button></div></div>
<div id="aimHint" class="hidden">↑ ↓ AIM · SPACE JUMP · J FIRE · E ACT · F POWER</div>
</div><div id="saveNotice" class="hidden" role="status"></div><span class="version-chip">v3.7</span>
</div></div>
<script>

'use strict';
const $=id=>document.getElementById(id),canvas=$('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
const C={floor:450,gravity:.57,move:3.9,jump:-11.8};
const levels=[
{title:'THE FIRST SPARK',world:'The Awakening Grounds',badge:'⚡',suit:'#8fe4df',sky:'#183759',hill:'#426883',accent:'#80e9da',topic:'Systems · Surroundings · Heat · Work',task:'Collect three energy sparks, then repair the boundary gate.',intro:[['PIP','Psst! Flux! You are awake! Our world has lost its spark.'],['FLUX','Where did all the energy go?'],['PIP','Energy crosses boundaries as heat or work. Find three sparks, then meet me at the gate!']],end:'The generator was our system; everything outside it was the surroundings. Heat and work are two ways energy crosses that boundary. Internal energy is a state function—it depends on the current state, not the path taken.',upgrade:'Explorer suit calibrated',science:'Systems and surroundings; heat and work; state functions (U, H, G and S). Heat (q) and work (w) describe transfers, not energy stored inside a system.'},
{title:'POWER PLANT PANIC',world:'The Copperworks',badge:'🔋',suit:'#f4bd73',sky:'#392947',hill:'#684e70',accent:'#ffc176',topic:'First Law · Energy Conservation',task:'Collect energy units and convert them to power the turbine.',intro:[['PIP','Welcome to the Copperworks! The turbines are completely still.'],['FLUX','Can we just make some extra energy?'],['PIP','Nice try! Energy can be transferred or transformed, but never created from nothing.']],end:'The First Law says energy is conserved. The three energy units you collected powered motion and released heat—energy changed form, but did not vanish. In chemistry, ΔU = q + w, where w is work done on the system.',upgrade:'Copper power suit unlocked',science:'First Law of Thermodynamics. ΔU = q + w (chemistry sign convention: work done on the system is positive).'},
{title:'THE HEATWAVE',world:'The Sunscorch Passage',badge:'🌡️',suit:'#ff9477',sky:'#66394e',hill:'#af695f',accent:'#ffb57c',topic:'Second Law · Entropy · Heat Flow',task:'Find the valve that lets heat flow naturally.',intro:[['PIP','Oh no. The thermal bridge is stuck between a hot chamber and a cold one!'],['FLUX','Which direction should we open the valve?'],['PIP','Look at the temperatures. One direction happens naturally. The other requires outside work.']],end:'Heat spontaneously moves from hot to cold. Moving heat from cold to hot is possible, but needs work, as in a refrigerator. The Second Law says the total entropy of an isolated system does not decrease.',upgrade:'Thermal suit unlocked',science:'Second Law; spontaneous heat flow hot → cold; entropy generation in real processes. Reversing heat flow requires external work.'},
{title:'FROZEN FRONTIER',world:'The Crystal Tundra',badge:'❄️',suit:'#a4ceff',sky:'#283e6d',hill:'#5c81aa',accent:'#c9eeff',topic:'Third Law · Absolute Zero',task:'Run the cryo pump three times to approach absolute zero.',intro:[['PIP','Brrr! These ancient crystals are nearly still.'],['FLUX','Can we make the temperature exactly zero Kelvin?'],['PIP','Try the cooling machine and watch what happens each time.']],end:'Every cooling stage got us closer to 0 K, but never all the way there. The Third Law says the entropy of a perfect crystal approaches zero as temperature approaches 0 K. Absolute zero cannot be reached by a finite sequence of cooling steps.',upgrade:'Cryo suit unlocked',science:'Third Law: entropy of a perfect crystal tends to zero as T→0 K; absolute zero cannot be reached in finite cooling operations.'},
{title:'HERE WE GO AGAIN...',world:'The Forgotten Mountain',badge:'🪨',suit:'#c6b5a0',sky:'#56536e',hill:'#918c80',accent:'#f6d2a0',topic:'Work · Spontaneity · Energy Landscapes',task:'Push the boulder to the summit. Do not let it roll back!',intro:[['PIP','Um... is that a man pushing a boulder?'],['FLUX','I feel like I have seen this example somewhere...'],['PIP','Apparently we are doing this one again. Push it uphill!']],end:'Pushing a boulder uphill requires work to increase gravitational potential energy; on a downhill slope, gravity drives its motion. Friction also converts some mechanical energy to heat, making the real motion irreversible. The hill is an analogy for favorable changes, not a literal chemical Gibbs free-energy calculation.',upgrade:'Mountain climber suit unlocked',science:'Uphill motion requires external work. Gravitational downhill motion is an analogy for thermodynamic favorability. Physical irreversibility (friction) can dissipate mechanical energy as heat.'},
{title:'REACTION REACTOR',world:'The Gibbs Foundry',badge:'🧪',suit:'#b0f29b',sky:'#254f57',hill:'#478681',accent:'#a5f3b1',topic:'Enthalpy · Entropy · Gibbs Free Energy',task:'Adjust the reactor temperature until ΔG is negative.',intro:[['PIP','The reaction chamber is stuck. We need a favorable reaction!'],['FLUX','What makes a reaction favorable?'],['PIP','At constant temperature and pressure, check the sign of ΔG = ΔH − TΔS. Try changing T!']],end:'For this reaction, ΔH = +30 kJ and ΔS = +0.120 kJ/K. At 200 K, ΔG = +6 kJ, so the forward reaction is nonspontaneous. At 400 K, ΔG = −18 kJ, so it is spontaneous under these conditions. Spontaneous does not necessarily mean fast!',upgrade:'Gibbs reactor suit unlocked',science:'At constant temperature and pressure: ΔG = ΔH − TΔS; negative ΔG means thermodynamically spontaneous. Reaction rate is a different issue.'},
{title:'THE HEART OF THE UNIVERSE',world:'The Final Core',badge:'🌌',suit:'#ead8ff',sky:'#30224f',hill:'#634f8d',accent:'#dcc0ff',topic:'All Laws · State Functions · Spontaneity',task:'Restore the three core modules in order, then reach the portal.',intro:[['PIP','We made it, Flux! The heart of the universe is right here.'],['FLUX','Three broken modules. One final chance.'],['PIP','Energy, entropy, and free energy... everything we learned will help us fix this!']],end:'You restored the Core by conserving energy, respecting the natural direction of heat flow, and finding favorable conditions for a reaction. Thermodynamics helps predict which changes are possible and which direction is favored—not necessarily how fast they occur.',upgrade:'Master of thermodynamics',science:'Final synthesis: First, Second, and Third Laws; q and w; state functions; spontaneity and ΔG = ΔH − TΔS.'}
];

const VERSION='3.7',INSTRUCTIONS_VERSION='3.1';
const STORAGE='entropy-quest-save-v1';
const powers=[
 {id:'magnet',name:'ENERGY MAGNET',icon:'✦',color:'#fbd277',help:'Pulls nearby loose sparks and supply crystals toward you for 7 seconds.',lesson:'The magnet moves supplies; it does not create energy.'},
 {id:'capacitor',name:'CAPACITOR',icon:'⚡',color:'#f4bd73',help:'Transfers stored reserve to your blaster. In the circuit puzzle, aligns one pipe.',lesson:'A capacitor stores supplied energy and releases it later.'},
 {id:'thermal',name:'THERMAL SHIELD',icon:'◈',color:'#ff9477',help:'Blocks contact damage and hot vents for 6 seconds.',lesson:'Insulation reduces heat transfer; it does not reverse its natural direction.'},
 {id:'cryo',name:'CRYO PULSE',icon:'❄',color:'#a4ceff',help:'Slows nearby drones and creates temporary ice bridges in the tundra for 7 seconds.',lesson:'The fictional suit removes heat using work; cooling still stays above 0 K.'},
 {id:'grip',name:'GRIP BOOTS',icon:'▲',color:'#c6b5a0',help:'Double jump, stronger traction, and less fatigue while pushing for 7 seconds.',lesson:'Better equipment helps you supply work. The same height still needs the same increase in potential energy.'},
 {id:'catalyst',name:'CATALYST BOOST',icon:'🧪',color:'#b0f29b',help:'Speeds favorable reactions threefold for 7 seconds. Positive ΔG stays positive.',lesson:'A catalyst lowers the activation barrier. It changes rate, not ΔG or equilibrium.'}
];
const missions=[
 {task:'Find 3 sparks. Aim 2 heat packets at Q and 1 work packet at W.',intro:[['PIP','The boundary gate needs three energy tokens. Find the sparks on the ground and platforms.'],['FLUX','So I get to throw science at things?'],['PIP','Exactly. Q takes two HEAT tokens, W takes one WORK token. Use TOOL to switch, aim ↑ ↓, then FIRE. Your magnet helps collect supplies.']],science:'Choose a system boundary. Heat (q) and work (w) transfer energy across it; they are not substances. In this token model, q=+2 and w=+1 give ΔU=+3. Aiming tokens is a game representation of energy transfer.',end:'You supplied the gate with two heat tokens and one work token: ΔU=q+w=+3. The energy came from collected supplies. A missed or rejected token returns to your inventory.'},
 {task:'Find both battery cells, then route the generator circuit.',intro:[['PIP','The generator has a broken circuit, and patrol drones are guarding its two battery cells—two stored energy units each.'],['FLUX','Can I just make more energy?'],['PIP','Nope. Collect the cells, stun or avoid drones, then ACT at the generator. Rotate the pipes to connect IN to OUT. The capacitor can align a pipe.']],science:'First Law: ΔU=q+w. This generator releases 4 stored energy units: q=−1 to the surroundings and w=−3 as work done by the generator. Its ΔU is −4. A circuit routes existing energy; it never creates extra energy.',end:'The circuit sent 3 units out as work and 1 as heat. With the generator as the system, q=−1, w=−3, and ΔU=−4. You accounted for every unit.'},
 {task:'Send heat from the 360 K source into both cooler receivers.',intro:[['PIP','The source is at 360 K. Three receivers are waiting, but only two accept heat spontaneously.'],['FLUX','And those vents look rude.'],['PIP','Time your jumps, use the thermal shield, and FIRE at the cooler receivers. Sending heat to a hotter one would need outside work.']],science:'Heat flows spontaneously from a hotter body to a cooler one. A 360 K source can spontaneously transfer heat to 300 K or 350 K, but not to 420 K. The total entropy of the source and receiver increases for these finite-temperature-difference transfers.',end:'You chose 300 K and 350 K as receivers for a 360 K source. Heat flowed hot→cold. Sending it to 420 K would require a driven process, such as a heat pump supplied with work.'},
 {task:'Retrieve 3 coolant crystals and run three cooling stages.',intro:[['PIP','Three coolant crystals are scattered across the tundra. Watch the gaps and drifting drones.'],['FLUX','Can we hit exactly zero Kelvin this time?'],['PIP','Each pump stage halves the temperature in our simplified model. Collect a crystal, ACT at the pump, and watch the result. Cryo makes temporary bridges and slows drones.']],science:'The Third Law says the entropy of a perfect crystal approaches zero as T approaches 0 K. The finite halving sequence 320→160→80→40 K illustrates approaching zero without reaching it. Each fictional cooling stage consumes a coolant supply and represents a pump requiring work.',end:'The pump cooled 320→160→80→40 K. Every finite stage left T above 0 K. You used coolant and work; you did not delete energy or reach absolute zero.'},
 {task:'Push uphill, manage stamina, and throw wedges to stop rollback.',intro:[['PIP','Oh good. The boulder again. This time it rolls back when you rest.'],['FLUX','Of course it does.'],['PIP','Hold ACT beside it to push. Aim a WEDGE at its base before resting. Grip boots help traction and fatigue. The halfway flag is a checkpoint.']],science:'Raising a boulder requires work to increase its gravitational potential energy, ΔPE=mgh. Friction dissipates some supplied work as heat. BOOST helps you push faster; it does not change mgh. Green rest ledges preserve your uphill progress. A wedge can hold the rock between ledges. This hill is an analogy, not a chemical Gibbs calculation.',end:'Your pushes supplied work, the hill stored gravitational potential energy, and friction released heat. Rest ledges preserved your progress. Better traction did not remove the need for work.'},
 {task:'Make A and B favorable; aim 2 capsules at A and 1 at B.',intro:[['PIP','Two reactors, three reagent capsules. A likes higher temperatures; B likes lower ones.'],['FLUX','Same rule, different signs?'],['PIP','Yes. ACT at each console to choose T. Read ΔG=ΔH−TΔS, then aim capsules into a favorable reactor. A catalyst speeds it up; it cannot fix positive ΔG.']],science:'At constant T and P, negative reaction ΔG favors the forward direction. Model A: ΔH=+30 kJ, ΔS=+0.120 kJ/K; at 400 K, ΔG=−18 kJ. Model B: ΔH=−20 kJ, ΔS=−0.080 kJ/K; at 200 K, ΔG=−4 kJ. At 250 K both model ΔG values are zero. These are illustrative values for fixed conditions. Catalysts affect rate, not ΔG or equilibrium.',end:'A became favorable at 400 K (−18 kJ), while B became favorable at 200 K (−4 kJ). Your catalyst changed how quickly favorable reactions finished, while leaving their ΔG unchanged.'},
 {task:'Restore energy, heat flow, and the Gibbs core—in that order.',intro:[['PIP','The final core mixes everything. Choose any unlocked gear for your route.'],['FLUX','Energy, heat flow, then the Gibbs reactor. Got it.'],['PIP','Collect three sparks and a capsule. FIRE the sparks into ENERGY, send heat to the cooler receiver, then choose a favorable reactor temperature and fire the capsule.']],science:'Final synthesis: transfer existing energy; use hot→cold heat flow; check ΔG under constant T and P; distinguish favorability from rate. Your gear aids movement, protection, collection, and reaction speed without changing the thermodynamic rules.',end:'The core works because your transfers conserve energy, your chosen heat receiver is cooler, and the reaction is favorable at its chosen temperature. Your strategy and suit helped carry out those changes.'}
];
levels.forEach((l,i)=>Object.assign(l,missions[i],{power:Math.min(i,5),upgrade:i===6?'All six suit powers mastered':powers[Math.min(i+1,5)].name+' ready for the next world'}));

function unlockAudio(fromGesture=true,rebuild=false){
 if(!save.sound||document.hidden){updateSoundLabel();return Promise.resolve(false);}
 try{
  // AudioSession is optional. Never request a microphone or other permission.
  if(save.music&&navigator.audioSession)try{navigator.audioSession.type='playback';}catch{}
  if(rebuild&&fromGesture&&audioCtx){stopAudioNotes();try{audioCtx.close().catch(()=>{});}catch{}audioCtx=null;}
  if(!audioCtx||audioCtx.state==='closed'){
   if(!fromGesture){updateSoundLabel();return Promise.resolve(false);}
   const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){updateSoundLabel();return Promise.resolve(false);}
   audioCtx=new Audio();audioMaster=audioCtx.createGain();audioMaster.gain.value=.8;audioMaster.connect(audioCtx.destination);
   const context=audioCtx;context.onstatechange=()=>{if(context!==audioCtx)return;if(context.state!=='running'){musicWorld=-1;musicNext=0;}updateSoundLabel();};
  }
  const context=audioCtx,resumed=context.state==='running'?Promise.resolve():context.resume();
  if(!musicTimer)musicTimer=setInterval(playMusicNote,50);
  return Promise.resolve(resumed).then(()=>{
   if(context!==audioCtx)return false;
   const ready=context.state==='running'&&save.sound&&!document.hidden;
   if(ready){audioMaster.gain.value=.8;playMusicNote();}updateSoundLabel();return ready;
  }).catch(()=>{updateSoundLabel();return false;});
 }catch{updateSoundLabel();return Promise.resolve(false);}
}

function playMusicNote(){
 if(!save.music||!save.sound||document.hidden||(screen!=='play'&&screen!=='prologue')||!audioCtx||audioCtx.state!=='running'){musicWorld=-1;musicNext=0;return;}
const theme=currentMusicTheme(),key=thermoFinale()?-4-stage.boss.finale.beat:theme===prologueTheme?-2:theme===valeTheme?-3:level,now=audioCtx.currentTime,step=30/theme.bpm;
 if(musicWorld!==key||musicNext<now-.25){musicWorld=key;musicBeat=0;musicNext=now+.01;}
 for(let count=0;count<2&&musicNext<=now+.08;count++){
  const beat=musicBeat++,delay=Math.max(0,musicNext-now),n=theme.notes[beat%theme.notes.length];
  const quiet=stage.boss?.finale?.mode==='memory'?.35:dialogue?.72:1;
  if(n)tone(n,step*.78,theme.wave,(theme.wave==='square'?.035:.065)*quiet,delay);
  if(beat%4===0)tone(theme.bass[Math.floor(beat/16)%4],step*1.7,'sine',.045*quiet,delay);
  if(theme.drive&&beat%2===0)tone(beat%4===0?65:90,.065,'triangle',(.016+theme.drive*.004)*quiet,delay);
  musicNext+=step;
 }
}

function showAbout(){screen='about';panel(`<div class="eyebrow">✦ A TINY STORY ABOUT A MASSIVE UNIVERSE ✦</div><div class="logo" style="font-size:32px">FLUX & PIP</div><div class="info"><h3>Meet ${character().name}</h3><p>${character().story}</p><p>These are fictional game heroes. Professor Aarons is a tribute inspired by your teacher, not a claim about her life or likeness.</p><h3>Pick your approach</h3><p>John is the curious student (easy). Dr. Flux is the Jamaican assistant scientist (medium). Professor Aarons is the experienced teacher (hard). Meet all three during the classroom prologue, then choose just before the world changes. Each has a different field outfit, opening thoughts, classroom ending and separate saved progress.</p><h3>The Thermo Safety Goggles</h3><p>Visiting scientist Dr. Vale demonstrates his Boundary Engine in Professor Aarons’ classroom. It redirects energy between connected places, but the transfers go wrong and alter the world. Vale powers a doorway to escape and drops his safety goggles from his lab coat. Pip helps ${character().name} retrieve them with MAGNET. X WEAR reveals the hidden paths. The portal and lenses are fictional technology; moving energy still needs a source.</p><h3>Seven worlds. One secret.</h3><p>Follow Vale’s trail through seven worlds, repairing the damage his Engine left behind. Pip is your floating energy-echo guide. Vale controls the Heart as his fortress. Restore its energy routes, fight his three-layer Engine, and bring the class home. Vale remains your enemy—no apology or redemption. Each level reveals a clue in the journal. No formulas are needed to play.</p><h3>Touch controller</h3><p>D-pad ← → moves. ↑ ↓ aims. A jumps, B fires, X uses nearby objects and changes its label to FIX, COOL, PUSH or SETUP. Y activates your power. The middle button switches WARM / PUSH shots in world 1. Tap POWER INFO to see what your power does or choose another unlocked power.</p><h3>Computer</h3><p>← → or A/D move · ↑ ↓ aim · SPAC function formulaCard(i){
 const variable=(symbol,name,meaning)=>`<div class="variable"><strong>${symbol} · ${name}</strong>${meaning}</div>`;
 if(i===0||i===1)return `<div class="science-card"><h3>🧳 The energy backpack</h3><div class="equation"><span>ΔU</span> = <span class="heat">q</span> + <span class="work">w</span></div><div class="variable-grid">${variable('ΔU','inside-energy change','How much the system’s energy backpack gains or loses. Δ means “change.”')}${variable('q','heat transfer','Energy entering or leaving because of a temperature difference.')}${variable('w','work transfer','Energy transferred by a push, compression, or another kind of work.')}${variable('+ / −','the door direction','Plus means energy enters our chosen system. Minus means it leaves.')}</div><p class="example">${i===0?'Your gate gets 2 heat tokens and 1 work token. Its backpack gains 3: +2 + +1 = +3.':'Your generator releases 1 unit as heat and 3 as work. Its backpack loses 4: −1 + −3 = −4.'}</p><p>The system is the object inside the boundary. The surroundings are everything outside. Tokens represent transfers; they are not literal particles of heat.</p></div>`;
 if(i===2)return `<div class="science-card"><h3>🌡️ Heat follows the downhill route</h3><div class="equation"><span class="heat">HOT</span> → <span class="work">COOL</span></div><div class="variable-grid">${variable('K','kelvin','A temperature scale measured from absolute zero. A bigger K number means hotter.')}${variable('Entropy','spreading out','A measure related to the microscopic ways energy and matter can be arranged. We count the source and receiver together.')}</div><p class="example">360 K can send heat naturally to 300 K or 350 K. Sending heat to 420 K would require outside work.</p><p>Heat spreads down a temperature difference. For these spontaneous transfers, total entropy increases. Your shield protects Flux; it does not turn uphill heat flow into a natural process.</p></div>`;
 if(i===3)return `<div class="science-card"><h3>❄️ The cold staircase</h3><div class="equation"><span>T next</span> = <span>T now</span> ÷ 2</div><div class="variable-grid">${variable('T now','current temperature','How warm the chamber is before the next cooling stage, in kelvin.')}${variable('T next','after cooling','The chamber’s temperature after our simplified halving stage. Still measured in kelvin.')}${variable('0 K','absolute zero','The lower temperature limit. A finite sequence of cooling operations cannot reach it.')}${variable('Third Law','the crystal limit','A perfect crystal’s entropy approaches zero as its temperature approaches 0 K.')}</div><p class="example">320 → 160 → 80 → 40 K. Each step gets colder. None becomes zero.</p><p>The halving staircase is a game model, not a universal formula for real cryogenic equipment. The pump removes heat and requires work.</p></div>`;
 if(i===4)return `<div class="science-card"><h3>🪨 Pay to climb, save at the summit</h3><div class="equation"><span>ΔPE</span> = <span>m</span> × <span>g</span> × <span>h</span></div><div class="variable-grid">${variable('ΔPE','stored height energy','The increase in gravitational potential energy after raising the boulder.')}${variable('m','mass','How much rock you are lifting. More mass means more work for the same height.')}${variable('g','gravity','The pull of gravity. Near Earth, its acceleration is about 9.8 m/s².')}${variable('h','height gained','How far upward the rock travels. More height means more stored energy.')}</div><p class="example">Same rock + same height = the same increase in stored height energy. BOOST helps you deliver the work; they do not change the bill.</p><p>Friction turns some of your supplied mechanical energy into heat. The hill is a physical analogy for a favored direction, not a calculation of chemical Gibbs energy.</p></div>`;
 return `<div class="science-card"><h3>🧪 The reaction’s go-or-drive signal</h3><div class="equation"><span>ΔG</span> = <span class="heat">ΔH</span> − <span class="work">T × ΔS</span></div><div class="variable-grid">${variable('ΔG','direction signal','The reaction’s Gibbs energy change. Negative favors the forward direction; positive needs driving. Zero has no net driving force.')}${variable('ΔH','heat bill','The reaction’s enthalpy change. At constant pressure, with only pressure-volume work, it is heat absorbed (+) or released (−).')}${variable('T','temperature dial','Absolute temperature in kelvin. More T gives the entropy term more weight. Celsius cannot go directly into this formula.')}${variable('ΔS','spreading-out change','The reaction’s entropy change. Positive: more microscopic ways to distribute energy and matter. Negative: fewer.')}</div><p class="example">A: +30 − 400 × (+0.120) = −18 kJ. Its positive entropy change helps more at a higher T.<br>B: −20 − 200 × (−0.080) = −4 kJ. Its negative entropy change makes a higher T less favorable.</p><p>Δ means “change”; kJ is an energy unit; kJ/K is entropy per kelvin. These are illustrative reaction values for fixed conditions at constant T and pressure. A catalyst lowers the reaction’s activation barrier and speeds it up. It does not change this direction signal.</p></div>`;
}
