{title:'THE FIRST SPARK',world:'The Awakening Grounds',badge:'⚡',suit:'#8fe4df',sky:'#183759',hill:'#426883',accent:'#80e9da',topic:'Systems · Surroundings · Heat · Work',task:'Collect three energy sparks, then repair the boundary gate.',intro:[['PIP','Psst! Flux! You are awake! Our world has lost its spark.'],['FLUX','Where did all the energy go?'],['PIP','Energy crosses boundaries as heat or work. Find three sparks, then meet me at the gate!']],end:'The generator was our system; everything outside it was the surroundings. Heat and work are two ways energy crosses that boundary. Internal energy is a state function—it depends on the current state, not the path taken.',upgrade:'Explorer suit calibrated',science:'Systems and surroundings; heat and work; state functions (U, H, G and S). Heat (q) and work (w) describe transfers, not energy stored inside a system.'},
{title:'POWER PLANT PANIC',world:'The Copperworks',badge:'🔋',suit:'#f4bd73',sky:'#392947',hill:'#684e70',accent:'#ffc176',topic:'First Law · Energy Conservation',task:'Collect energy units and convert them to power the turbine.',intro:[['PIP','Welcome to the Copperworks! The turbines are completely still.'],['FLUX','Can we just make some extra energy?'],['PIP','Nice try! Energy can be transferred or transformed, but never created from nothing.']],end:'The First Law says energy is conserved. The three energy units you collected powered motion and released heat—energy changed form, but did not vanish. In chemistry, ΔU = q + w, where w is work done on the system.',upgrade:'Copper power suit unlocked',science:'First Law of Thermodynamics. ΔU = q + w (chemistry sign convention: work done on the system is positive).'},
{title:'THE HEATWAVE',world:'The Sunscorch Passage',badge:'🌡️',suit:'#ff9477',sky:'#66394e',hill:'#af695f',accent:'#ffb57c',topic:'Second Law · Entropy · Heat Flow',task:'Find the valve that lets heat flow naturally.',intro:[['PIP','Oh no. The thermal bridge is stuck between a hot chamber and a cold one!'],['FLUX','Which direction should we open the valve?'],['PIP','Look at the temperatures. One direction happens naturally. The other requires outside work.']],end:'Heat spontaneously moves from hot to cold. Moving heat from cold to hot is possible, but needs work, as in a refrigerator. The Second Law says the total entropy of an isolated system does not decrease.',upgrade:'Thermal suit unlocked',science:'Second Law; spontaneous heat flow hot → cold; entropy generation in real processes. Reversing heat flow requires external work.'},
{title:'FROZEN FRONTIER',world:'The Crystal Tundra',badge:'❄️',suit:'#a4ceff',sky:'#283e6d',hill:'#5c81aa',accent:'#c9eeff',topic:'Third Law · Absolute Zero',task:'Run the cryo pump three times to approach absolute zero.',intro:[['PIP','Brrr! These ancient crystals are nearly still.'],['FLUX','Can we make the temperature exactly zero Kelvin?'],['PIP','Try the cooling machine and watch what happens each time.']],end:'Every cooling stage got us closer to 0 K, but never all the way there. The Third Law says the entropy of a perfect crystal approaches zero as temperature approaches 0 K. Absolute zero cannot be reached by a finite sequence of cooling steps.',upgrade:'Cryo suit unlocked',science:'Third Law: entropy of a perfect crystal tends to zero as T→0 K; absolute zero cannot be reached in finite cooling operations.'},
{title:'HERE WE GO AGAIN...',world:'The Forgotten Mountain',badge:'🪨',suit:'#c6b5a0',sky:'#56536e',hill:'#918c80',accent:'#f6d2a0',topic:'Work · Spontaneity · Energy Landscapes',task:'Push the boulder to the summit. Do not let it roll back!',intro:[['PIP','Um... is that a man pushing a boulder?'],['FLUX','I feel like I have seen this example somewhere...'],['PIP','Apparently we are doing this one again. Push it uphill!']],end:'Pushing a boulder uphill requires work to increase gravitational potential energy; on a downhill slope, gravity drives its motion. Friction also converts some mechanical energy to heat, making the real motion irreversible. The hill is an analogy for favorable changes, not a literal chemical Gibbs free-energy calculation.',upgrade:'Mountain climber suit unlocked',science:'Uphill motion requires external work. Gravitational downhill motion is an analogy for thermodynamic favorability. Physical irreversibility (friction) can dissipate mechanical energy as heat.'},
{title:'REACTION REACTOR',world:'The Gibbs Foundry',badge:'🧪',suit:'#b0f29b',sky:'#254f57',hill:'#478681',accent:'#a5f3b1',topic:'Enthalpy · Entropy · Gibbs Free Energy',task:'Adjust the reactor temperature until ΔG is negative.',intro:[['PIP','The reaction chamber is stuck. We need a favorable reaction!'],['FLUX','What makes a reaction favorable?'],['PIP','At constant temperature and pressure, check the sign of ΔG = ΔH − TΔS. Try changing T!']],end:'For this reaction, ΔH = +30 kJ and ΔS = +0.120 kJ/K. At 200 K, ΔG = +6 kJ, so the forward reaction is nonspontaneous. At 400 K, ΔG = −18 kJ, so it is spontaneous under these conditions. Spontaneous does not necessarily mean fast!',upgrade:'Gibbs reactor suit unlocked',science:'At constant temperature and pressure: ΔG = ΔH − TΔS; negative ΔG means thermodynamically spontaneous. Reaction rate is a different issue.'},

function freshSave(){return {unlocked:0,current:0,completed:[],xp:0,sound:true,music:true,controller:true,gear:0,runs:{},keys:{},version:2};}
function readSave(){try{const j=JSON.parse(localStorage.getItem(STORAGE));if(!j||typeof j!=='object')return freshSave();const s={...freshSave(),...j};s.unlocked=Math.max(0,Math.min(6,Number(j.unlocked)||0));s.current=Math.max(0,Math.min(s.unlocked,Number(j.current)||0));s.completed=Array.isArray(j.completed)?[...new Set(j.completed.filter(x=>Number.isInteger(x)&&x>=0&&x<7))]:[];s.gear=Math.max(0,Math.min(5,Number(j.gear)||0));s.runs=j.version===2&&j.runs&&typeof j.runs==='object'?j.runs:{};s.version=2;return s;}catch{return freshSave();}}
let save=readSave(),screen='menu',level=0,player={},last=0,ticks=0,accumulator=0,particles=[],pickups=[],projectiles=[],enemies=[],dialogue=null,dialogueTimer=0,toastTimer=0,controls={},stage={},portalHint=false,aim=0,shotTimer=0,noticeTimer=0,powerCooldown=0,powerTime=0,equipped=0,jumpQueued=false,checkpoint=90,activeRun=false;

function store(){try{localStorage.setItem(STORAGE,JSON.stringify(save));$('saveNotice').classList.add('hidden');}catch{$('saveNotice').textContent='Saving unavailable in this browser. Keep this tab open to retain this run.';$('saveNotice').classList.remove('hidden');}}
function persistRun(){if(!stage.initialized||!activeRun)return;const snapshot=JSON.parse(JSON.stringify(stage));for(const p of projectiles)if(p.resource&&!p.settled&&!p.refunded)snapshot[p.resource]++;save.runs[level]={stage:snapshot,pickups:JSON.parse(JSON.stringify(pickups)),x:isGap(player.x)?checkpoint:player.x,y:player.y,checkpoint,gear:equipped};store();}
function clearControls(){controls={left:false,right:false,up:false,down:false,fire:false,act:false};jumpQueued=false;document.querySelectorAll('[data-control]').forEach(b=>b.classList.remove('held'));}
function unlockAudio(){if(!save.sound)return Promise.resolve();try{if(!audioCtx||audioCtx.state==='closed'){audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioMaster=audioCtx.createGain();audioMaster.gain.value=.65;audioMaster.connect(audioCtx.destination);}const resumed=audioCtx.state==='running'?Promise.resolve():audioCtx.resume();if(!musicTimer)musicTimer=setInterval(playMusicNote,250);return resumed.catch(()=>{});}catch{return Promise.resolve();}}
function tone(freq=600,dur=.09,type='square',vol=.06,delay=0){if(!save.sound||!audioCtx||audioCtx.state!=='running')return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(Math.max(.001,vol),t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audioMaster);o.start(t);o.stop(t+dur);o.onended=()=>{o.disconnect();g.disconnect();};}catch{}}
function beep(freq=600,dur=.09,type='square',vol=.06){tone(freq,dur,type,vol);}
function playMusicNote(){if(!save.music||!save.sound||document.hidden||screen!=='play'||dialogue)return;const notes=[261.63,0,329.63,392,0,329.63,293.66,0,220,0,329.63,349.23,0,293.66,261.63,0],n=notes[musicBeat++%notes.length];if(n)tone(n,.2,'triangle',.035);if(musicBeat%4===0)tone([130.81,110,146.83,98][Math.floor(musicBeat/16)%4],.45,'sine',.025);}
function toggleSound(){save.sound=!save.sound;store();if(save.sound)unlockAudio().then(()=>beep(740,.2));updateSoundLabel();}
function updateSoundLabel(){if($('soundBtn')){$('soundBtn').textContent=save.sound?'🔊':'🔇';$('soundBtn').setAttribute('aria-label',save.sound?'Mute sound':'Enable sound');}}

function showMenu(){if(screen==='play')persistRun();screen='menu';dialogue=null;panel(`<div class="eyebrow">✦ A LITTLE UNIVERSE WITH BIG RULES ✦</div><div class="logo">ENTROPY<br>QUEST</div><div class="lead">Aim. Explore. Experiment.<br>A little strategy can restore a whole universe.</div><div class="menu-buttons"><button class="btn primary gold" data-act="continue">▶ ${Object.keys(save.runs).length||save.completed.length?'CONTINUE ADVENTURE':'START ADVENTURE'}</button><button class="btn secondary" data-act="map">⌘ WORLD MAP</button><button class="btn secondary" data-act="journal">▤ SCIENCE JOURNAL</button><button class="btn secondary" data-act="gear">✦ SUIT POWERS</button><button class="btn secondary" data-act="settings">⚙ SETTINGS & SOUND</button><button class="btn secondary" data-act="about">✧ STORY & CONTROLS</button><button class="btn secondary" data-act="new">↺ NEW GAME</button></div><p class="small">Strategic adventure v${VERSION} · D-pad + keyboard · Checkpoints auto-save</p>`);}
function showMap(){if(screen==='play')persistRun();screen='map';dialogue=null;const cards=levels.map((l,i)=>`<button class="level-tile ${i>save.unlocked?'locked':save.completed.includes(i)?'done':'active'}" ${i>save.unlocked?'disabled':''} data-level="${i}"><span class="emoji">${i<=save.unlocked?l.badge:'🔒'}</span><strong>${i+1}. ${l.title}</strong><span>${save.completed.includes(i)?'✓ COMPLETE':save.runs[i]?'↪ CHECKPOINT':i<=save.unlocked?'▶ READY':'LOCKED'}</span></button>`).join('');panel(`<div class="eyebrow">✦ SEVEN WORLDS. SEVEN WAYS TO THINK. ✦</div><div class="logo" style="font-size:30px">WORLD MAP</div><p class="lead">Each chapter unlocks the next. Your earlier saves still count.</p><div class="map-grid">${cards}</div><span class="stat">✦ ${save.xp} XP</span><span class="stat">✓ ${save.completed.length}/7 WORLDS</span><div class="back-row"><button class="btn secondary" data-act="menu">← MAIN MENU</button><button class="btn gold" data-act="continue">▶ CONTINUE</button></div>`);}
function showAbout(){screen='about';panel(`<div class="eyebrow">✦ A TINY STORY ABOUT A MASSIVE UNIVERSE ✦</div><div class="logo" style="font-size:32px">FLUX & PIP</div><div class="info"><p>The Heart of the Universe fractured. Flux and Pip need your experiments to restore its seven worlds.</p><h3>Touch controller</h3><p>D-pad ← → moves. ↑ ↓ aims. A jumps, B fires, X interacts, Y activates your selected power. TOOL switches heat/work tokens in world 1. Tap GEAR to equip a different unlocked suit power.</p><h3>Computer</h3><p>← → or A/D move · ↑ ↓ aim · SPACE/W jump · J fire · E interact · F power · Q switch tool · R gear · ESC pause.</p><h3>Explore without losing your work</h3><p>Drones can be stunned with your blaster or avoided. Use the glowing charging pad to refill shots. If you fall or lose all hearts, Pip returns you to a checkpoint with your objectives intact.</p><p>Your suit powers are fictional tools. Thermodynamic signs and conditions follow the lessons; energy packets represent transfers, not literal heat particles.</p></div><div class="back-row"><button class="btn secondary" data-act="menu">← BACK</button><button class="btn gold" data-act="continue">▶ PLAY</button></div>`);}
function showSettings(){screen='settings';panel(`<div class="eyebrow">✦ PLAYER OPTIONS ✦</div><div class="logo" style="font-size:30px">SETTINGS</div><div class="back-row"><button class="btn" data-act="sound">${save.sound?'🔊 MUTE':'🔈 ENABLE'} SOUND</button><button class="btn gold" data-act="testSound">♪ TEST SOUND</button><button class="btn secondary" data-act="music">MUSIC: ${save.music?'ON':'OFF'}</button><button class="btn secondary" data-act="bindings">REMOTE / GAMEPAD</button><button class="btn secondary" data-act="controller">CONTROLLER: ${save.controller?'ON':'OFF'}</button></div><p class="small" id="audioStatus">Audio starts after a tap. If silent, enable sound, raise your volume, and check your iPhone’s silent mode.</p><p class="small">Level objectives and checkpoints save in this browser. Different devices keep separate saves.</p><div class="back-row"><button class="btn secondary" data-act="menu">← BACK</button><button class="btn secondary" data-act="reset">RESET PROGRESS</button></div>`);}
function showJournal(){const returnTo=screen==='play'||screen==='paused'?'resume':'menu';if(screen==='play')persistRun();screen='journal';panel(`<div class="eyebrow">✦ YOUR FIELD NOTES ✦</div><div class="logo" style="font-size:28px">SCIENCE JOURNAL</div><div class="info">${levels.map((l,i)=>`<h3>${l.badge} ${i+1}. ${l.title}</h3><p>${l.science}</p>${formulaCard(i)}`).join('')}<h3>Gear is help, not a loophole</h3><p>${powers.map(p=>`${p.name}: ${p.lesson}`).join(' ')}</p><h3>Spontaneous ≠ fast</h3><p>A negative ΔG favors a direction under specified conditions. It does not promise a fast reaction. A catalyst lowers the activation barrier and speeds the approach to equilibrium without changing ΔG or the equilibrium constant.</p><h3>Reversible vs. irreversible</h3><p>An ideal reversible process stays arbitrarily close to equilibrium. Real friction and heat flow across a finite temperature difference generate entropy.</p></div><div class="back-row"><button class="btn gold" data-act="${returnTo}">${returnTo==='resume'?'▶ RESUME':'← BACK'}</button></div>`);}
function showGear(){const returnTo=screen==='play'||screen==='paused'?'resume':'menu';if(screen==='play')persistRun();screen='gear';panel(`<div class="eyebrow">✦ EQUIP A POWER. CHANGE YOUR APPROACH. ✦</div><div class="logo" style="font-size:28px">SUIT POWERS</div><div class="gear-grid">${powers.map((p,i)=>`<button class="gear-tile ${i>Math.min(save.unlocked,5)?'locked':i===equipped?'equipped':''}" ${i>Math.min(save.unlocked,5)?'disabled':''} data-gear="${i}" data-return="${returnTo}"><strong>${i>Math.min(save.unlocked,5)?'🔒':p.icon} ${p.name}</strong><span>${p.help}</span><small>${i>Math.min(save.unlocked,5)?`Unlock in world ${i+1}`:i===equipped?'EQUIPPED':'TAP TO EQUIP'}</small></button>`).join('')}</div><p class="small">Y / F activates your power. Each use has a cooldown. The suit’s external charging network supplies its tools; a machine’s energy ledger counts that machine’s transfers. Earlier powers remain available in later worlds.</p><div class="back-row"><button class="btn gold" data-act="${returnTo}">${returnTo==='resume'?'▶ RESUME':'← MAIN MENU'}</button></div>`);}

function platforms(){const base=[{x:290,y:364,w:125},{x:530,y:345,w:128}];if(level===3){base.push({x:690,y:285,w:105});if(powerTime>0&&equipped===3)base.push({x:432,y:450,w:70},{x:695,y:450,w:68});}if(level===5)base.push({x:700,y:285,w:90});return base;}
function floorAt(x){if(level===4&&x>420)return C.floor-Math.min(180,(x-420)*.5);return C.floor;}
function isGap(x){return level===3&&((x>432&&x<502)||(x>695&&x<763))&&!(powerTime>0&&equipped===3);}
function makePickups(i){const spots=[[220,409],[352,318],[610,306]];if(i===0)return spots.map(([x,y])=>({x,y,type:'energy',taken:false}));if(i===1)return [[265,408],[605,306]].map(([x,y])=>({x,y,type:'cell',taken:false}));if(i===3)return [[350,318],[575,303],[740,246]].map(([x,y])=>({x,y,type:'coolant',taken:false}));if(i===5)return spots.map(([x,y])=>({x,y,type:'reagent',taken:false}));if(i===6)return [...spots.map(([x,y])=>({x,y,type:'energy',taken:false})),{x:405,y:408,type:'reagent',taken:false}];return [];}

function formulaCard(i){
 const variable=(symbol,name,meaning)=>`<div class="variable"><strong>${symbol} · ${name}</strong>${meaning}</div>`;
 if(i===0||i===1)return `<div class="science-card"><h3>🧳 The energy backpack</h3><div class="equation"><span>ΔU</span> = <span class="heat">q</span> + <span class="work">w</span></div><div class="variable-grid">${variable('ΔU','inside-energy change','How much the system’s energy backpack gains or loses. Δ means “change.”')}${variable('q','heat transfer','Energy entering or leaving because of a temperature difference.')}${variable('w','work transfer','Energy transferred by a push, compression, or another kind of work.')}${variable('+ / −','the door direction','Plus means energy enters our chosen system. Minus means it leaves.')}</div><p class="example">${i===0?'Your gate gets 2 heat tokens and 1 work token. Its backpack gains 3: +2 + +1 = +3.':'Your generator releases 1 unit as heat and 3 as work. Its backpack loses 4: −1 + −3 = −4.'}</p><p>The system is the object inside the boundary. The surroundings are everything outside. Tokens represent transfers; they are not literal particles of heat.</p></div>`;
 if(i===2)return `<div class="science-card"><h3>🌡️ Heat follows the downhill route</h3><div class="equation"><span class="heat">HOT</span> → <span class="work">COOL</span></div><div class="variable-grid">${variable('K','kelvin','A temperature scale measured from absolute zero. A bigger K number means hotter.')}${variable('Entropy','spreading out','A measure related to the microscopic ways energy and matter can be arranged. We count the source and receiver together.')}</div><p class="example">360 K can send heat naturally to 300 K or 350 K. Sending heat to 420 K would require outside work.</p><p>Heat spreads down a temperature difference. For these spontaneous transfers, total entropy increases. Your shield protects Flux; it does not turn uphill heat flow into a natural process.</p></div>`;
 if(i===3)return `<div class="science-card"><h3>❄️ The cold staircase</h3><div class="equation"><span>T next</span> = <span>T now</span> ÷ 2</div><div class="variable-grid">${variable('T now','current temperature','How warm the chamber is before the next cooling stage, in kelvin.')}${variable('T next','after cooling','The chamber’s temperature after our simplified halving stage. Still measured in kelvin.')}${variable('0 K','absolute zero','The lower temperature limit. A finite sequence of cooling operations cannot reach it.')}${variable('Third Law','the crystal limit','A perfect crystal’s entropy approaches zero as its temperature approaches 0 K.')}</div><p class="example">320 → 160 → 80 → 40 K. Each step gets colder. None becomes zero.</p><p>The halving staircase is a game model, not a universal formula for real cryogenic equipment. The pump removes heat and requires work.</p></div>`;
 if(i===4)return `<div class="science-card"><h3>🪨 Pay to climb, save at the summit</h3><div class="equation"><span>ΔPE</span> = <span>m</span> × <span>g</span> × <span>h</span></div><div class="variable-grid">${variable('ΔPE','stored height energy','The increase in gravitational potential energy after raising the boulder.')}${variable('m','mass','How much rock you are lifting. More mass means more work for the same height.')}${variable('g','gravity','The pull of gravity. Near Earth, its acceleration is about 9.8 m/s².')}${variable('h','height gained','How far upward the rock travels. More height means more stored energy.')}</div><p class="example">Same rock + same height = the same increase in stored height energy. Grip boots help you deliver the work; they do not change the bill.</p><p>Friction turns some of your supplied mechanical energy into heat. The hill is a physical analogy for a favored direction, not a calculation of chemical Gibbs energy.</p></div>`;
 return `<div class="science-card"><h3>🧪 The reaction’s go-or-drive signal</h3><div class="equation"><span>ΔG</span> = <span class="heat">ΔH</span> − <span class="work">T × ΔS</span></div><div class="variable-grid">${variable('ΔG','direction signal','The reaction’s Gibbs energy change. Negative favors the forward direction; positive needs driving. Zero has no net driving force.')}${variable('ΔH','heat bill','The reaction’s enthalpy change. At constant pressure, with only pressure-volume work, it is heat absorbed (+) or released (−).')}${variable('T','temperature dial','Absolute temperature in kelvin. More T gives the entropy term more weight. Celsius cannot go directly into this formula.')}${variable('ΔS','spreading-out change','The reaction’s entropy change. Positive: more microscopic ways to distribute energy and matter. Negative: fewer.')}</div><p class="example">A: +30 − 400 × (+0.120) = −18 kJ. Its positive entropy change helps more at a higher T.<br>B: −20 − 200 × (−0.080) = −4 kJ. Its negative entropy change makes a higher T less favorable.</p><p>Δ means “change”; kJ is an energy unit; kJ/K is entropy per kelvin. These are illustrative reaction values for fixed conditions at constant T and pressure. A catalyst lowers the reaction’s activation barrier and speeds it up. It does not change this direction signal.</p></div>`;

 const previousX=player.x,previousY=player.y,wasOnGround=player.onGround,support=groundPlayer();
 const move=(controls.right?1:0)-(controls.left?1:0);player.vx=move*C.move;if(move)player.dir=move;

function stepProjectiles(){const alive=[];for(const p of projectiles){p.x+=p.vx;p.y+=p.vy;p.life--;if(p.kind==='wedge')p.vy+=.24;let hit=receiverHit(p);if(!hit){for(const e of enemies){if(Math.hypot(p.x-e.x,p.y-e.y)<25&&p.kind!=='wedge'){e.stun=p.kind==='ice'?270:160;refund(p);burst(e.x,e.y,'#9fe7e1',9);hit=true;toast('DRONE STUNNED · Take the opening or change route.');break;}}}if(!hit&&p.kind==='wedge'&&p.y>=floorAt(p.x)){if(level===4&&Math.abs(p.x-stage.boulder)<75){stage.anchored=true;milestone('WEDGE SET · Rest, recover, then keep pushing.');}else toast('WEDGE MISSED · Aim at the boulder’s base.');hit=true;}if(!hit&&(p.life<=0||p.x<0||p.x>960||p.y<30||p.y>580)){refund(p);hit=true;}if(!hit)alive.push(p);}projectiles=alive;}

function pressControl(name){unlockAudio();if(dialogue){if(['act','fire','jump','power'].includes(name))advanceSpeech();return;}if(screen!=='play')return;if(['left','right','up','down','fire','act'].includes(name))controls[name]=true;if(name==='jump')jumpQueued=true;if(name==='fire')shoot();if(name==='act')action();if(name==='power')activatePower();}
function releaseControl(name){if(name in controls)controls[name]=false;}
$('overlay').addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-level],[data-gear],[data-pipe],[data-temp],[data-bind]');if(!b||b.disabled)return;unlockAudio().then(()=>beep(500,.06));if(b.hasAttribute('data-bind')){pendingBinding=b.dataset.bind;showBindings();return;}if(b.hasAttribute('data-level')){startLevel(Number(b.dataset.level));return;}if(b.hasAttribute('data-gear')){if(equipped!==Number(b.dataset.gear))powerTime=0;equipped=Number(b.dataset.gear);save.gear=equipped;if(stage.initialized)persistRun();else store();b.dataset.return==='resume'?resumeGame():showMenu();return;}if(b.hasAttribute('data-pipe')){const i=Number(b.dataset.pipe);stage.circuit[i]=rotatePipe(stage.circuit[i]);persistRun();showCircuit();return;}if(b.hasAttribute('data-temp')){const i=stage.console,t=Number(b.dataset.temp);if(i===2)stage.coreT=t;else stage.reactors[i].t=t;persistRun();showTemperature(i);return;}switch(b.dataset.act){case 'bindings':showBindings();break;case 'defaultKeys':save.keys={};pendingBinding=null;store();showBindings();break;case 'continue':continueGame();break;case 'new':if((save.completed.length||Object.keys(save.runs).length)&&!confirm('Start a new adventure and erase this browser’s saved progress?'))break;save=freshSave();store();startLevel(0,true);break;case 'menu':showMenu();break;case 'map':showMap();break;case 'settings':showSettings();break;case 'about':showAbout();break;case 'journal':showJournal();break;case 'gear':showGear();break;case 'resume':resumeGame();break;case 'sound':toggleSound();showSettings();break;case 'music':save.music=!save.music;store();showSettings();break;case 'controller':save.controller=!save.controller;store();showSettings();break;case 'testSound':save.sound=true;store();unlockAudio().then(()=>{tone(523,.22,'triangle',.12);tone(659,.22,'triangle',.12,.22);tone(784,.3,'triangle',.12,.44);const status=$('audioStatus');if(status)status.textContent=audioCtx?.state==='running'?'♪ Sound test played. If silent, check device volume and silent mode.':'Tap TEST SOUND again to start audio.';});break;case 'next':startLevel(Math.min(6,level+1));break;case 'testCircuit':testCircuit();break;case 'circuitPower':activatePower();break;case 'reset':if(confirm('Erase this browser’s progress?')){save=freshSave();stage={};store();showSettings();}break;}});
$('pauseBtn').addEventListener('click',pauseGame);$('journalBtn').addEventListener('click',showJournal);$('soundBtn').addEventListener('click',toggleSound);$('gearBtn').addEventListener('click',showGear);$('toolBtn').addEventListener('click',toggleTool);$('speech').addEventListener('click',advanceSpeech);
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',ArrowDown:'down',Space:'jump',KeyW:'jump',KeyJ:'fire',KeyE:'act',KeyF:'power'};
window.addEventListener('keydown',e=>{if(screen==='bindings'&&pendingBinding){e.preventDefault();if(e.code==='Escape')pendingBinding=null;else if(!['ShiftLeft','ShiftRight','ControlLeft','ControlRight','MetaLeft','MetaRight','AltLeft','AltRight'].includes(e.code)){save.keys=save.keys||{};save.keys[pendingBinding]=e.code;pendingBinding=null;store();}showBindings();return;}if(e.target?.matches?.('input,textarea,select'))return;unlockAudio();if(e.code==='Escape'){e.preventDefault();screen==='play'?pauseGame():screen==='paused'?resumeGame():showMenu();return;}if(screen==='circuit'&&e.code==='KeyF'&&!e.repeat){activatePower();return;}if(screen!=='play')return;if(controlForKey(e.code)){e.preventDefault();if(!e.repeat)pressControl(controlForKey(e.code));}if(e.code==='Enter'&&!e.repeat&&dialogue){e.preventDefault();advanceSpeech();}if(e.code==='KeyQ'&&!e.repeat)toggleTool();if(e.code==='KeyR'&&!e.repeat)showGear();});
window.addEventListener('keyup',e=>{if(controlForKey(e.code))releaseControl(controlForKey(e.code));});window.addEventListener('blur',()=>{clearControls();if(screen==='play')persistRun();});document.addEventListener('visibilitychange',()=>{clearControls();if(document.hidden&&screen==='play')persistRun();});window.addEventListener('pagehide',()=>{if(screen==='play')persistRun();});
const activePointers=new Map();for(const b of document.querySelectorAll('[data-control]')){const name=b.dataset.control;b.addEventListener('pointerdown',e=>{e.preventDefault();activePointers.set(e.pointerId,{name,button:b});b.setPointerCapture(e.pointerId);b.classList.add('held');pressControl(name);});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{activePointers.delete(e.pointerId);if(![...activePointers.values()].some(p=>p.name===name)){b.classList.remove('held');releaseControl(name);}});b.addEventListener('contextmenu',e=>e.preventDefault());}
window.addEventListener('pointerdown',()=>unlockAudio(),{capture:true});
showMenu();requestAnimationFrame(animate);

</script></body></html>
