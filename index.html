<title>Entropy Quest — A Thermodynamics Adventure</title>
<style>
:root{--ink:#0b1124;--deep:#10172b;--panel:#17243c;--blue:#6bcbf2;--gold:#fbd277;--cream:#f7f1de;--mint:#83f0c5;--pink:#f2a3b1;--sub:#aebed9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090f20;color:var(--cream);font-family:'Trebuchet MS',Verdana,sans-serif;touch-action:manipulation}button{font-family:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #fff;outline-offset:4px}#shell{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:10px;background:radial-gradient(ellipse at 50% 30%,#22365c 0%,#0a1021 76%)}#gameFrame{position:relative;width:min(100%,1100px);aspect-ratio:16/9;background:#121e35;overflow:hidden;border:4px solid #617da2;box-shadow:0 0 0 4px #172947,0 25px 75px #000a,inset 0 0 20px #0006;image-rendering:pixelated}#gameCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}#overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#071127bd,#0a1123e5);overflow-y:auto;padding:20px}#overlay.hidden,#hud.hidden,#controls.hidden,#speech.hidden,#toast.hidden{display:none!important}.panel{width:min(92%,720px);max-height:100%;overflow-y:auto;background:#13223be8;border:3px solid #6a9cb8;box-shadow:8px 8px 0 #071529, inset 0 0 0 3px #263c5d;padding:18px 22px;text-align:center}.logo{font-family:monospace;font-size:clamp(27px,5vw,60px);font-weight:900;letter-spacing:1px;color:#ffd77c;text-shadow:4px 4px 0 #9d4e62,8px 8px 0 #192b4b;line-height:1.02;margin:8px 0 12px}.eyebrow{font-family:monospace;font-size:clamp(9px,1.5vw,13px);letter-spacing:2px;color:#8bf0d3;font-weight:bold}.lead{color:#d7e0ef;line-height:1.55;margin:5px 0 14px}.btn{border:2px solid #96d8e7;background:#27658b;box-shadow:4px 4px 0 #09172b;padding:10px 16px;font-weight:bold;letter-spacing:.5px;min-height:44px;transition:transform .1s,filter .1s;font-size:14px}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #09172b}.btn:hover{filter:brightness(1.18)}.btn.secondary{background:#2a3757;border-color:#788ba8}.btn.gold{background:#b57747;border-color:#f9d17d}.btn:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}.menu-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(420px,100%);margin:auto}.menu-buttons>.primary{grid-column:span 2}.small{color:#aabbd5;font-size:12px;line-height:1.5}.map-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:15px 0}.level-tile{min-height:115px;background:#283d59;border:2px solid #5c81a0;padding:9px 5px;display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;transition:filter .15s}.level-tile .emoji{font-size:27px}.level-tile strong{font-size:11px;line-height:1.2}.level-tile span{font-size:10px;color:#b1d1e4}.level-tile.locked{filter:grayscale(1);opacity:.44}.level-tile.done{border-color:#8df0c6;background:#244c57}.level-tile.active{border-color:#ffd87a;background:#584b36}.level-tile:hover:not(:disabled){filter:brightness(1.2)}#hud{position:absolute;z-index:2;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px;gap:8px;pointer-events:none}#hud>*{pointer-events:auto}.hud-left{background:#132239e8;border:2px solid #6692b0;padding:8px 11px;min-width:280px;max-width:65%}.hud-title{font: bold 14px monospace;color:#ffe29d}.hud-quest{font-size:12px;color:#d0e4f1;line-height:1.35;margin-top:4px}.hud-right{display:flex;align-items:center;gap:7px}.hud-pill{background:#192841e8;border:2px solid #739ab2;padding:8px;color:#fbd880;font:bold 12px monospace}.hud-button{background:#233a57e8;border:2px solid #739ab2;padding:7px 11px;font:bold 12px monospace}#speech{position:absolute;z-index:6;left:50%;bottom:25px;transform:translateX(-50%);width:min(91%,660px);min-height:103px;background:#f9f3db;color:#24344c;border:4px solid #172d45;box-shadow:6px 6px 0 #071629;padding:13px 17px 11px;display:flex;align-items:flex-start;gap:12px;cursor:pointer}#speech::before{content:'';position:absolute;bottom:-20px;left:40px;border:9px solid transparent;border-top-color:#172d45}#speechFace{flex:0 0 44px;height:44px;background:#3f8d9f;border:3px solid #28475f;box-shadow:inset 3px 3px #80e7d6;display:grid;place-items:center;font-size:23px}#speechBody{flex:1;min-width:0}#speechSpeaker{font:bold 12px monospace;color:#ad5571;margin-bottom:4px}#speechText{font:15px/1.45 'Trebuchet MS',Verdana,sans-serif;min-height:45px}#speechNext{font:11px monospace;text-align:right;color:#59647d;animation:blink 1s infinite}@keyframes blink{50%{opacity:.3}}#toast{position:absolute;z-index:5;top:80px;left:50%;transform:translateX(-50%);background:#fbd67f;color:#213147;border:3px solid #2f4561;padding:9px 12px;text-align:center;font-size:13px;font-weight:bold;max-width:82%;pointer-events:none}#controls{position:absolute;z-index:3;left:0;right:0;bottom:7px;padding:0 12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.control-group{display:flex;gap:12px}.touch-btn{pointer-events:auto;width:65px;height:59px;background:#1a2c46bc;border:3px solid #9dd8e7;border-radius:11px;box-shadow:inset 0 3px 0 #ffffff25;color:white;font:bold 23px monospace;touch-action:none;user-select:none;-webkit-user-select:none}.touch-btn.act{font-size:13px;background:#77613fc9;border-color:#ffe09b}.touch-btn:active,.touch-btn.held{background:#4e89aa}#help{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font:11px monospace;color:#deecffab;z-index:2;pointer-events:none}.stat{display:inline-block;margin:4px 5px;padding:5px 8px;color:#9df1d6;border:1px solid #436e80;font-size:12px}.back-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.info{line-height:1.55;text-align:left;font-size:14px;color:#dbe6f7}.info h3{color:#fdd585;margin-bottom:6px}.info p{margin-top:0}.info li{margin:6px 0}#rotateHint{display:none;position:absolute;z-index:7;right:8px;top:64px;background:#101e35df;border:1px solid #a9c1d0;font:10px monospace;color:#e1f2ff;padding:6px}.completion-title{font:bold clamp(26px,4vw,43px) monospace;color:#ffdb86;text-shadow:3px 3px #8a5060}.reward{color:#8ef1c9;font:bold 18px monospace;margin:12px}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#6186a0}@media (pointer:coarse){#controls:not(.hidden){display:flex}#help{display:none}}@media (pointer:fine){#controls{display:none!important}}@media (max-width:650px) and (orientation:portrait){#shell{align-items:flex-start;padding:3px;padding-top:12vh}#gameFrame{border-width:2px}#overlay{padding:6px}.panel{padding:12px;max-height:100%}.logo{font-size:28px}.eyebrow{font-size:9px;letter-spacing:0}.btn{min-height:32px;padding:5px 8px;font-size:11px;box-shadow:2px 2px 0 #09172b}.menu-buttons{gap:6px}.small{font-size:9px}.map-grid{gap:4px;margin:5px 0}.level-tile{min-height:57px;padding:3px;gap:2px}.level-tile .emoji{font-size:15px}.level-tile strong{font-size:8px}.level-tile span{font-size:7px}.lead{font-size:11px;line-height:1.25;margin:4px 0 7px}#hud{padding:3px 5px}.hud-left{min-width:0;padding:3px 5px;max-width:72%}.hud-title{font-size:9px}.hud-quest{font-size:8px;margin-top:1px}.hud-pill{font-size:8px;padding:4px}.hud-button{font-size:8px;padding:4px}#speech{bottom:0;padding:5px 7px;min-height:0;width:98%;gap:5px;border-width:2px}#speechFace{flex-basis:24px;height:24px;font-size:14px;border-width:2px}#speechSpeaker{font-size:8px}#speechText{font-size:10px;min-height:0;line-height:1.3}#speechNext{font-size:7px}#controls{bottom:4px;padding:0 6px}.control-group{gap:5px}.touch-btn{height:35px;width:40px;border-width:2px;font-size:17px;border-radius:7px}.touch-btn.act{font-size:9px}#rotateHint{display:block;top:auto;bottom:45px;font-size:8px;padding:3px}#toast{top:40px;padding:3px;font-size:9px}.stat{font-size:9px;margin:2px;padding:2px}.reward{font-size:12px;margin:2px}.completion-title{font-size:21px}.back-row{margin-top:5px;gap:4px}.info{font-size:10px;line-height:1.25}.info h3{margin:3px} .info p{margin-bottom:4px}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:650px) and (orientation:portrait){#shell{padding:2vh 3px;align-items:center}#gameFrame{height:min(92dvh,750px);aspect-ratio:auto;background:radial-gradient(ellipse at center,#253c5f 0%,#101a30 75%)}#gameCanvas{height:auto;top:50%;transform:translateY(-50%)}#overlay{padding:10px}.panel{max-height:96%;padding:12px 13px}.logo{font-size:34px;margin:5px 0 12px}.eyebrow{font-size:10px}.lead{font-size:13px;line-height:1.4;margin:10px 0}.menu-buttons{gap:9px}.btn{min-height:43px;padding:10px;font-size:12px}.small{font-size:10px}.map-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:12px 0}.level-tile{min-height:83px;padding:6px;gap:4px}.level-tile .emoji{font-size:22px}.level-tile strong{font-size:10px}.level-tile span{font-size:9px}#hud{top:6px;padding:3px 7px}.hud-left{padding:7px;max-width:65%}.hud-title{font-size:10px}.hud-quest{font-size:9px;line-height:1.3}.hud-pill,.hud-button{font-size:9px;padding:6px}#speech{bottom:94px;width:95%;padding:10px 9px;min-height:85px;gap:7px}#speechFace{flex-basis:35px;height:35px;font-size:20px}#speechSpeaker{font-size:11px}#speechText{font-size:12px;line-height:1.4}#speechNext{font-size:9px}#controls{bottom:13px;padding:0 15px}.control-group{gap:8px}.touch-btn{height:59px;width:65px;font-size:22px}.touch-btn.act{font-size:13px}#rotateHint{bottom:78px;right:8px;font-size:9px}#toast{top:70px;font-size:11px;padding:8px}.completion-title{font-size:26px}.reward{font-size:15px;margin:8px}.info{font-size:12px;line-height:1.5}.info h3{margin:9px 0 4px}.info p{margin:0 0 7px}}
</style>

<body>
<div id="shell"><div id="gameFrame">
<canvas id="gameCanvas" width="960" height="540" aria-label="Entropy Quest game world"></canvas>
<div id="hud" class="hidden"><div class="hud-left"><div class="hud-title" id="hudTitle"></div><div class="hud-quest" id="hudQuest"></div></div><div class="hud-right"><span class="hud-pill" id="hudXP"></span><button class="hud-button" id="pauseBtn" aria-label="Pause game">☰ MENU</button></div></div>
<div id="overlay"></div>
<div id="speech" class="hidden" role="dialog" aria-label="Character dialogue"><div id="speechFace">✦</div><div id="speechBody"><div id="speechSpeaker">PIP</div><div id="speechText"></div><div id="speechNext">TAP TO CONTINUE ▾</div></div></div>
<div id="toast" class="hidden" role="status"></div>
<div id="controls" class="hidden"><div class="control-group"><button class="touch-btn" data-control="left" aria-label="Move left">◀</button><button class="touch-btn" data-control="right" aria-label="Move right">▶</button></div><div class="control-group"><button class="touch-btn act" data-control="action" aria-label="Interact">ACT</button><button class="touch-btn" data-control="jump" aria-label="Jump">▲</button></div></div>
<div id="help">← → / A D MOVE · SPACE JUMP · E INTERACT · ESC MENU</div>
<div id="rotateHint">↻ Rotate phone for bigger view</div>
</div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
const C={floor:450,gravity:.57,move:3.9,jump:-11.8};
const levels=[
{title:'THE FIRST SPARK',world:'The Awakening Grounds',badge:'⚡',suit:'#8fe4df',sky:'#183759',hill:'#426883',accent:'#80e9da',topic:'Systems · Surroundings · Heat · Work',task:'Collect three energy sparks, then repair the boundary gate.',intro:[['PIP','Psst! Flux! You are awake! Our world has lost its spark.'],['FLUX','Where did all the energy go?'],['PIP','Energy crosses boundaries as heat or work. Find three sparks, then meet me at the gate!']],end:'The generator was our system; everything outside it was the surroundings. Heat and work are two ways energy crosses that boundary. Internal energy is a state function—it depends on the current state, not the path taken.',upgrade:'Explorer suit calibrated',science:'Systems and surroundings; heat and work; state functions (U, H, G and S). Heat (q) and work (w) describe transfers, not energy stored inside a system.'},
{title:'POWER PLANT PANIC',world:'The Copperworks',badge:'🔋',suit:'#f4bd73',sky:'#392947',hill:'#684e70',accent:'#ffc176',topic:'First Law · Energy Conservation',task:'Collect energy units and convert them to power the turbine.',intro:[['PIP','Welcome to the Copperworks! The turbines are completely still.'],['FLUX','Can we just make some extra energy?'],['PIP','Nice try! Energy can be transferred or transformed, but never created from nothing.']],end:'The First Law says energy is conserved. The three energy units you collected powered motion and released heat—energy changed form, but did not vanish. In chemistry, ΔU = q + w, where w is work done on the system.',upgrade:'Copper power suit unlocked',science:'First Law of Thermodynamics. ΔU = q + w (chemistry sign convention: work done on the system is positive).'},
{title:'THE HEATWAVE',world:'The Sunscorch Passage',badge:'🌡️',suit:'#ff9477',sky:'#66394e',hill:'#af695f',accent:'#ffb57c',topic:'Second Law · Entropy · Heat Flow',task:'Find the valve that lets heat flow naturally.',intro:[['PIP','Oh no. The thermal bridge is stuck between a hot chamber and a cold one!'],['FLUX','Which direction should we open the valve?'],['PIP','Look at the temperatures. One direction happens naturally. The other requires outside work.']],end:'Heat spontaneously moves from hot to cold. Moving heat from cold to hot is possible, but needs work, as in a refrigerator. The Second Law says the total entropy of an isolated system does not decrease.',upgrade:'Thermal suit unlocked',science:'Second Law; spontaneous heat flow hot → cold; entropy generation in real processes. Reversing heat flow requires external work.'},
{title:'FROZEN FRONTIER',world:'The Crystal Tundra',badge:'❄️',suit:'#a4ceff',sky:'#283e6d',hill:'#5c81aa',accent:'#c9eeff',topic:'Third Law · Absolute Zero',task:'Run the cryo pump three times to approach absolute zero.',intro:[['PIP','Brrr! These ancient crystals are nearly still.'],['FLUX','Can we make the temperature exactly zero Kelvin?'],['PIP','Try the cooling machine and watch what happens each time.']],end:'Every cooling stage got us closer to 0 K, but never all the way there. The Third Law says the entropy of a perfect crystal approaches zero as temperature approaches 0 K. Absolute zero cannot be reached by a finite sequence of cooling steps.',upgrade:'Cryo suit unlocked',science:'Third Law: entropy of a perfect crystal tends to zero as T→0 K; absolute zero cannot be reached in finite cooling operations.'},
{title:'HERE WE GO AGAIN...',world:'The Forgotten Mountain',badge:'🪨',suit:'#c6b5a0',sky:'#56536e',hill:'#918c80',accent:'#f6d2a0',topic:'Work · Spontaneity · Energy Landscapes',task:'Push the boulder to the summit. Do not let it roll back!',intro:[['PIP','Um... is that a man pushing a boulder?'],['FLUX','I feel like I have seen this example somewhere...'],['PIP','Apparently we are doing this one again. Push it uphill!']],end:'Pushing a boulder uphill requires work to increase gravitational potential energy; on a downhill slope, gravity drives its motion. Friction also converts some mechanical energy to heat, making the real motion irreversible. The hill is an analogy for favorable changes, not a literal chemical Gibbs free-energy calculation.',upgrade:'Mountain climber suit unlocked',science:'Uphill motion requires external work. Gravitational downhill motion is an analogy for thermodynamic favorability. Physical irreversibility (friction) can dissipate mechanical energy as heat.'},
{title:'REACTION REACTOR',world:'The Gibbs Foundry',badge:'🧪',suit:'#b0f29b',sky:'#254f57',hill:'#478681',accent:'#a5f3b1',topic:'Enthalpy · Entropy · Gibbs Free Energy',task:'Adjust the reactor temperature until ΔG is negative.',intro:[['PIP','The reaction chamber is stuck. We need a favorable reaction!'],['FLUX','What makes a reaction favorable?'],['PIP','At constant temperature and pressure, check the sign of ΔG = ΔH − TΔS. Try changing T!']],end:'For this reaction, ΔH = +30 kJ and ΔS = +0.120 kJ/K. At 200 K, ΔG = +6 kJ, so the forward reaction is nonspontaneous. At 400 K, ΔG = −18 kJ, so it is spontaneous under these conditions. Spontaneous does not necessarily mean fast!',upgrade:'Gibbs reactor suit unlocked',science:'At constant temperature and pressure: ΔG = ΔH − TΔS; negative ΔG means thermodynamically spontaneous. Reaction rate is a different issue.'},
{title:'THE HEART OF THE UNIVERSE',world:'The Final Core',badge:'🌌',suit:'#ead8ff',sky:'#30224f',hill:'#634f8d',accent:'#dcc0ff',topic:'All Laws · State Functions · Spontaneity',task:'Restore the three core modules in order, then reach the portal.',intro:[['PIP','We made it, Flux! The heart of the universe is right here.'],['FLUX','Three broken modules. One final chance.'],['PIP','Energy, entropy, and free energy... everything we learned will help us fix this!']],end:'You restored the Core by conserving energy, respecting the natural direction of heat flow, and finding favorable conditions for a reaction. Thermodynamics helps predict which changes are possible and which direction is favored—not necessarily how fast they occur.',upgrade:'Master of thermodynamics',science:'Final synthesis: First, Second, and Third Laws; q and w; state functions; spontaneity and ΔG = ΔH − TΔS.'}
];
const STORAGE='entropy-quest-save-v1';
function freshSave(){return{unlocked:0,current:0,completed:[],xp:0,sound:true}}
function readSave(){try{const j=JSON.parse(localStorage.getItem(STORAGE));if(!j)return freshSave();return{...freshSave(),...j,unlocked:Math.max(0,Math.min(6,j.unlocked||0)),current:Math.max(0,Math.min(6,j.current||0)),completed:Array.isArray(j.completed)?j.completed:[]}}catch{return freshSave()}}
let save=readSave(),screen='menu',level=0,player={x:88,y:405,vx:0,vy:0,onGround:false,dir:1},last=0,ticks=0,particles=[],pickups=[],dialogue=null,dialogueTimer=0,toastTimer=0,controls={left:false,right:false,jump:false},stage={},portalHint=false;
function store(){try{localStorage.setItem(STORAGE,JSON.stringify(save))}catch(e){}}
let audioCtx;
function beep(freq=600,dur=.07,type='square',vol=.025){if(!save.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function panel(html){$('overlay').innerHTML='<div class="panel">'+html+'</div>';$('overlay').classList.remove('hidden');$('hud').classList.add('hidden');$('controls').classList.add('hidden');$('speech').classList.add('hidden');$('toast').classList.add('hidden')}
function showMenu(){screen='menu';dialogue=null;panel(`<div class="eyebrow">✦ A LITTLE UNIVERSE WITH BIG RULES ✦</div><div class="logo">ENTROPY<br>QUEST</div><div class="lead">A retro-modern adventure through energy, entropy, and the laws that shape our universe.</div><div class="menu-buttons"><button class="btn primary gold" data-act="new">▶ NEW GAME</button><button class="btn primary" data-act="continue">↪ CONTINUE GAME</button><button class="btn secondary" data-act="map">⌘ WORLD MAP</button><button class="btn secondary" data-act="about">✧ STORY & ABOUT</button><button class="btn secondary" data-act="settings">⚙ SETTINGS</button><button class="btn secondary" data-act="journal">▤ SCIENCE JOURNAL</button></div><p class="small">Mobile & desktop friendly · Auto-saves after levels · Original student project prototype</p>`)}
function showMap(){screen='map';let cards=levels.map((l,i)=>{const open=i<=save.unlocked,done=save.completed.includes(i);return `<button class="level-tile ${!open?'locked':done?'done':'active'}" ${!open?'disabled':''} data-level="${i}"><span class="emoji">${open?l.badge:'🔒'}</span><strong>${i+1}. ${l.title}</strong><span>${done?'✓ COMPLETE':open?'▶ READY':'LOCKED'}</span></button>`}).join('');panel(`<div class="eyebrow">✦ TRAVEL THROUGH THE FRACTURED UNIVERSE ✦</div><div class="logo" style="font-size:clamp(24px,3.1vw,38px)">WORLD MAP</div><p class="lead">Each chapter restores one piece of the universe. New worlds unlock in story order.</p><div class="map-grid">${cards}</div><span class="stat">✦ ${save.xp} XP</span><span class="stat">✓ ${save.completed.length}/7 WORLDS</span><div class="back-row"><button class="btn secondary" data-act="menu">← MAIN MENU</button><button class="btn gold" data-act="continue">▶ CONTINUE STORY</button></div>`)}
function showAbout(){screen='about';panel(`<div class="eyebrow">✦ A TINY STORY ABOUT A MASSIVE UNIVERSE ✦</div><div class="logo" style="font-size:36px">THE STORY</div><div class="info"><h3>Meet Flux & Pip</h3><p>Flux is a curious little explorer. Pip is a floating companion who talks a lot and worries just enough for both of them. When the Heart of the Universe fractures, seven connected worlds lose their balance.</p><p>Every world has its own rule. To repair them, Flux must discover how energy moves, transforms, spreads, and determines which changes are possible.</p><h3>Why play?</h3><p>Thermodynamics isn't just a chemistry vocabulary test. It's behind ice melting, batteries powering devices, refrigerators, reactions, and everything changing around us. Play the experiments; learn the science.</p><p>This game is designed for anyone curious about science, no chemistry background required.</p></div><div class="back-row"><button class="btn" data-act="menu">← BACK</button><button class="btn gold" data-act="continue">▶ PLAY</button></div>`)}
function showSettings(){screen='settings';panel(`<div class="eyebrow">✦ PLAYER OPTIONS ✦</div><div class="logo" style="font-size:32px">SETTINGS</div><div class="lead">Sound effects: <strong>${save.sound?'ON':'OFF'}</strong></div><div class="back-row"><button class="btn" data-act="sound">${save.sound?'🔊 MUTE':'🔈 ENABLE'} SOUND</button><button class="btn secondary" data-act="menu">← BACK</button></div><p class="small">Progress saves automatically in this browser after every completed level. Clearing browser data will remove your save. Use a published URL for the most reliable saved progress.</p><div class="back-row"><button class="btn secondary" data-act="reset">RESET PROGRESS</button></div>`)}
function showJournal(){screen='journal';let l=levels.map((v,i)=>`<h3>${v.badge} ${i+1}. ${v.title}</h3><p>${v.science}</p>`).join('');panel(`<div class="eyebrow">✦ YOUR FIELD NOTES ✦</div><div class="logo" style="font-size:30px">SCIENCE JOURNAL</div><div class="info">${l}<h3>Bonus: Reversible vs. irreversible</h3><p>An ideal reversible process can be reversed by an infinitesimal change while keeping system and surroundings arbitrarily close to equilibrium. Real processes with friction or finite temperature differences are irreversible and generate entropy.</p><h3>Quick reminder</h3><p>A spontaneous process is thermodynamically favored under specified conditions; it may still happen very slowly. The gravitational boulder is an analogy, not a chemical ΔG calculation.</p></div><div class="back-row"><button class="btn" data-act="menu">← BACK</button></div>`)}
function resetStage(i){level=i;player={x:90,y:C.floor-34,vx:0,vy:0,onGround:true,dir:1};stage={energy:0,done:false,pump:0,temp:320,temperature:200,boulder:525,rollTimer:0,finalStep:0,attempts:0};pickups=i<=1||i===6?[[225,408],[352,318],[611,408]].map(([x,y])=>({x,y,taken:false})):[];particles=[];portalHint=false;ticks=0;save.current=i;store();}
function startLevel(i){if(i>save.unlocked)return;resetStage(i);screen='play';$('overlay').classList.add('hidden');$('hud').classList.remove('hidden');$('controls').classList.remove('hidden');updateHUD();say(levels[i].intro);}
function continueGame(){const n=save.current<=save.unlocked?save.current:save.unlocked;startLevel(n)}
function say(lines,onEnd){dialogue={lines,index:0,shown:0,onEnd:onEnd||null};$('speech').classList.remove('hidden');renderSpeech()}
function renderSpeech(){if(!dialogue)return;const [name,text]=dialogue.lines[dialogue.index];$('speechSpeaker').textContent=name;$('speechFace').textContent=name==='FLUX'?'◉':name==='PIP'?'✦':'★';$('speechText').textContent=text.slice(0,Math.floor(dialogue.shown));$('speechNext').textContent=dialogue.shown<text.length?'TAP TO REVEAL ▾':'TAP TO CONTINUE ▾'}
function advanceSpeech(){if(!dialogue)return;const text=dialogue.lines[dialogue.index][1];if(dialogue.shown<text.length){dialogue.shown=text.length;renderSpeech();return}if(dialogue.index<dialogue.lines.length-1){dialogue.index++;dialogue.shown=0;renderSpeech();return}const done=dialogue.onEnd;dialogue=null;$('speech').classList.add('hidden');if(done)done()}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');toastTimer=150}
function updateHUD(){if(screen!=='play')return;const l=levels[level];$('hudTitle').textContent=`WORLD ${level+1} · ${l.title}`;let task=l.task;if(level===0||level===1)task+=`  ✦ ${stage.energy}/3`;
if(level===3)task=`CRYO CHAMBER: ${stage.temp} K · Cooling stages ${stage.pump}/3`;
if(level===4)task=`BOULDER PROGRESS: ${Math.min(100,Math.round((stage.boulder-525)/2.35))}% · Press ACT near it`;
if(level===5)task=`T = ${stage.temperature} K   ·   ΔG = ${30-stage.temperature*.120>0?'+':''}${(30-stage.temperature*.120).toFixed(0)} kJ`;
if(level===6)task=`FINAL CORE: ${stage.finalStep}/3 MODULES ONLINE · Energy sparks ${stage.energy}/3`;
if(stage.done)task='PORTAL OPEN! ✨ Reach the door on the right.';$('hudQuest').textContent=task;$('hudXP').textContent=`✦ ${save.xp} XP`}
function action(){if(screen!=='play')return;if(dialogue){advanceSpeech();return}const px=player.x;beep(450,.04);if(level===0||level===1){if(Math.abs(px-730)<94){if(stage.energy===3){stage.done=true;burst(735,365,levels[level].accent);toast(level===0?'BOUNDARY GATE REPAIRED!':'ENERGY TRANSFORMED: MOTION + HEAT!');beep(800,.22)}else toast('Find all three energy sparks first!')}else toast('Find the machine on the right side!')}
else if(level===2){if(Math.abs(px-435)<85){stage.attempts++;toast('Cold → hot needs external work! Try the other valve.')}else if(Math.abs(px-660)<90){stage.done=true;burst(660,335,'#fbb682');toast('HOT → COLD! ENTROPY INCREASES OVERALL.');beep(800,.22)}else toast('Stand beside a thermal valve, then press ACT.')}
else if(level===3){if(Math.abs(px-705)<110){if(stage.pump<3){stage.pump++;stage.temp=stage.temp/2;burst(700,350,'#bef2ff');toast(`TEMPERATURE: ${stage.temp} K · Still above 0 K!`);if(stage.pump===3)stage.done=true;beep(550+stage.pump*130,.16)}}else toast('Go to the glowing cryo pump on the right!')}
else if(level===4){if(Math.abs(px-stage.boulder)<100){stage.rollTimer=105;stage.boulder=Math.min(760,stage.boulder+31);player.x=Math.min(stage.boulder-43,player.x+18);burst(stage.boulder,C.floor-75,'#d6b991',6);beep(290,.07);if(stage.boulder>=760){stage.done=true;toast('SUMMIT REACHED! UPHILL REQUIRED WORK.');beep(850,.23)}}else toast('Get beside the boulder and press ACT repeatedly!')}
else if(level===5){if(Math.abs(px-700)<112){if(stage.temperature===200){stage.temperature=400;stage.done=true;toast('ΔG = −18 kJ · REACTION FAVORABLE!');burst(695,354,'#b3ffaa');beep(870,.22)}else{stage.temperature=200;stage.done=false;toast('ΔG = +6 kJ · NONSPONTANEOUS')}}else toast('Stand near the reactor temperature lever!')}
else if(level===6){const positions=[435,595,735],target=positions[stage.finalStep];if(Math.abs(px-target)<90){if(stage.finalStep===0&&stage.energy<3){toast('Collect all three sparks to conserve and transfer energy.');return}stage.finalStep++;burst(target,356,['#ffce77','#ff9688','#a4f6ba'][stage.finalStep-1]);beep(560+stage.finalStep*140,.20);toast(['ENERGY RESTORED!','ENTROPY MODULE RESTORED!','FREE ENERGY CORE ONLINE!'][stage.finalStep-1]);if(stage.finalStep>=3)stage.done=true}else toast(`Repair module ${stage.finalStep+1} in order!`)}updateHUD()}
function finishLevel(){if(screen!=='play'||dialogue)return;const l=levels[level],wasDone=save.completed.includes(level);if(!wasDone){save.completed.push(level);save.xp+=100;save.unlocked=Math.max(save.unlocked,Math.min(6,level+1))}save.current=level===6?6:Math.min(6,level+1);store();beep(740,.2);setTimeout(()=>beep(1000,.3),130);screen=level===6?'ending':'complete';panel(`<div class="eyebrow">✦ CHAPTER ${level+1} RESTORED ✦</div><div class="completion-title">${level===6?'UNIVERSE RESTORED!':'LEVEL COMPLETE!'}</div><div class="reward">${wasDone?'✓ REPLAY FINISHED':'+100 XP · SUIT UPGRADED!'}</div><span class="stat">✦ ${save.xp} TOTAL XP</span><span class="stat">✓ ${save.completed.length}/7 COMPLETE</span><div class="info"><h3>${l.badge} WHAT YOU DISCOVERED</h3><p>${l.end}</p><h3>✧ ${l.upgrade}</h3><p>${level===6?'Flux and Pip brought balance back to the seven worlds. The adventure is complete!':`Next up: ${levels[level+1].title} in ${levels[level+1].world}.`}</p></div><div class="back-row">${level<6?`<button class="btn gold" data-act="next">NEXT CHAPTER →</button>`:'<button class="btn gold" data-act="map">VIEW COMPLETED WORLDS</button>'}<button class="btn secondary" data-act="map">WORLD MAP</button><button class="btn secondary" data-act="journal">SCIENCE NOTES</button></div>`)}
function burst(x,y,color,n=18){for(let i=0;i<n;i++){particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.7)*7,life:36+Math.random()*20,color})}}
function drawRect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawText(s,x,y,size=14,color='#f0f2ec',align='center'){ctx.font=`bold ${size}px monospace`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign='left'}
function drawStars(time){for(let i=0;i<56;i++){const x=(i*149+57)%960,y=(i*71+31)%350;drawRect(x,y,2+(i%7===0?2:0),2,i%6===0?'#d5e8f7':'#a5bcdc');if(i%9===0&&Math.sin(time/40+i)>.4)drawRect(x-2,y+1,6,1,'#defbff')}}
function drawSky(){const l=levels[level],sky=screen==='menu'?'#182846':l.sky;drawRect(0,0,960,540,sky);const t=ticks;if(level===3){for(let i=0;i<35;i++){const x=(i*37+17)%960,y=(i*93)%410;drawRect(x,y,2,5,'#b7e7ff') }}else drawStars(t);ctx.fillStyle=l.accent+'25';ctx.beginPath();ctx.arc(770,128,90,0,Math.PI*2);ctx.fill();ctx.fillStyle=l.accent;ctx.beginPath();ctx.arc(770,128,44,0,Math.PI*2);ctx.fill();
const layers=[{col:l.hill+'77',base:333,span:65,shift:40},{col:l.hill,base:425,span:75,shift:10}];for(const layer of layers){ctx.fillStyle=layer.col;ctx.beginPath();ctx.moveTo(0,540);ctx.lineTo(0,layer.base);for(let x=0;x<1040;x+=80){ctx.lineTo(x+30,layer.base-layer.span*(.22+.67*Math.abs(Math.sin((x+layer.shift)*.017))))}ctx.lineTo(960,540);ctx.closePath();ctx.fill()}
for(let i=0;i<12;i++){const x=i*95+20;drawRect(x,438,4,12,l.accent+'4f')}}
function drawMenuBackdrop(){drawRect(0,0,960,540,'#162844');drawStars(ticks);ctx.fillStyle='#86dddf';ctx.beginPath();ctx.arc(745,125,66,0,2*Math.PI);ctx.fill();ctx.fillStyle='#244566';ctx.beginPath();ctx.moveTo(0,450);for(let x=0;x<=960;x+=70){ctx.lineTo(x,340+Math.sin(x/100)*70)}ctx.lineTo(960,540);ctx.lineTo(0,540);ctx.fill();ctx.fillStyle='#152c49';ctx.beginPath();ctx.moveTo(0,490);for(let x=0;x<=960;x+=45){ctx.lineTo(x,405+Math.cos(x/90)*44)}ctx.lineTo(960,540);ctx.lineTo(0,540);ctx.fill();drawTinyFlux(775,350,'#8fe4df',1.7);drawPip(725,330)}
function drawGround(){const l=levels[level];drawRect(0,C.floor,960,90,'#1b2b3f');drawRect(0,C.floor,960,9,l.accent);for(let i=0;i<35;i++){const x=(i*83+3)%960;drawRect(x,474+(i*31)%62,23,4,l.hill);drawRect(x+9,466+(i*11)%51,3,3,l.accent+'80')}for(const p of [{x:290,y:364,w:125},{x:530,y:345,w:128}]){drawRect(p.x,p.y,p.w,13,l.hill);drawRect(p.x,p.y,p.w,5,l.accent);for(let z=p.x+7;z<p.x+p.w;z+=19)drawRect(z,p.y+10,11,4,'#1f3041')}}
function drawTinyFlux(x,y,color,scale=1,dir=1){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(dir*scale,scale); // x center, y feet
const r=(a,b,w,h,c)=>drawRect(a,b,w,h,c);r(-16,-35,32,29,'#1c344a');r(-14,-33,28,25,color);r(-11,-29,22,13,'#203a59');r(-7,-25,4,5,'#ffffff');r(4,-25,4,5,'#ffffff');r(-6,-23,2,3,'#25334f');r(5,-23,2,3,'#25334f');r(-6,-8,12,5,'#c1f3ff');r(-8,-3,7,5,'#20354e');r(3,-3,7,5,'#20354e');r(-18,-15,5,12,'#2c4865');r(13,-15,5,12,'#2c4865');r(-16,-42,4,9,'#26485c');r(-16,-43,4,4,'#ffe5a6');r(12,-13,7,12,'#e5c77f');ctx.restore()}
function drawPip(x,y){const bob=Math.sin(ticks*.09)*4;drawRect(x-12,y-11+bob,24,22,'#27475f');drawRect(x-9,y-8+bob,18,16,'#8ce7dc');drawRect(x-5,y-2+bob,3,4,'#20394a');drawRect(x+3,y-2+bob,3,4,'#20394a');drawRect(x-13,y+3+bob,4,4,'#f9d487');drawRect(x+9,y+3+bob,4,4,'#f9d487');drawRect(x-2,y-16+bob,4,6,'#d8f8ec')}
function drawPortal(){let x=892,y=C.floor-77;const color=stage.done?'#a6ffd3':'#8b9aaf';drawRect(x-28,y,59,78,'#1a2b43');drawRect(x-23,y-6,50,70,color);drawRect(x-18,y,40,64,stage.done?'#367e8c':'#26344d');if(stage.done){const r=15+4*Math.sin(ticks*.13);ctx.strokeStyle='#b3f7d2';ctx.lineWidth=4;ctx.strokeRect(x-9,y+10,18,r+18);drawText('OPEN',x,y-17,12,'#b0ffd0')}else drawText('LOCKED',x,y-17,11,'#d1b4af')}
function drawCoin(p,i){if(p.taken)return;const bob=Math.sin((ticks+i*13)*.09)*4;const y=p.y+bob;drawRect(p.x-10,y-10,20,20,'#fbd475');drawRect(p.x-7,y-7,14,14,'#b17d42');drawRect(p.x-3,y-5,6,10,'#ffe4aa');drawText('✦',p.x,y+22,10,'#fff1b0')}
function drawMachine(x,color,label){drawRect(x-33,C.floor-90,70,90,'#1a2a41');drawRect(x-29,C.floor-86,62,79,'#47617c');drawRect(x-24,C.floor-80,52,48,'#142b47');drawRect(x-20,C.floor-75,44,38,color+'bb');drawRect(x-15,C.floor-67,12,13,'#fff1c2');drawRect(x+4,C.floor-60,12,8,'#193e4c');drawRect(x-33,C.floor-8,70,9,color);drawText(label,x,C.floor-107,12,'#fff5df')}
function drawLevelObjects(){const col=levels[level].accent;if(level===0){drawMachine(735,stage.done?'#7fffd2':col,'BOUNDARY GATE');drawText('HEAT ↔ WORK',735,278,12,'#fbecb6')}
if(level===1){drawMachine(735,col,'TURBINE');ctx.save();ctx.translate(735,355);ctx.rotate(stage.done?ticks/10:0);for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);drawRect(-6,-34,12,32,'#f7c276')}ctx.restore();drawText('3 ENERGY → POWER + HEAT',735,266,11,'#ffd8a9')}
if(level===2){drawMachine(435,'#67b1f3','COLD → HOT');drawMachine(660,'#ff9c79','HOT → COLD');drawText('COLD 10°C',435,261,13,'#afdbff');drawText('HOT 80°C',660,261,13,'#ffd09d');if(stage.done){for(let i=0;i<6;i++)drawRect(660-i*25,365+Math.sin(i+ticks/7)*13,9,8,'#ffc083')}}
if(level===3){drawMachine(705,'#bde9ff','CRYO PUMP');drawText(`${stage.temp} K`,705,294,27,'#fff2e3');for(let i=0;i<4;i++)drawRect(650+i*28,333-(i%2)*12,20,20,'#d3effa');}
if(level===4){ctx.fillStyle='#777886';ctx.beginPath();ctx.moveTo(450,C.floor);ctx.lineTo(806,C.floor-200);ctx.lineTo(870,C.floor);ctx.fill();ctx.strokeStyle='#dac0a6';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(450,C.floor);ctx.lineTo(806,C.floor-200);ctx.stroke();const by=C.floor-30-Math.max(0,(stage.boulder-525)*.57);ctx.fillStyle='#313646';ctx.beginPath();ctx.arc(stage.boulder,by,29,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a6a0a0';ctx.beginPath();ctx.arc(stage.boulder,by,25,0,Math.PI*2);ctx.fill();drawRect(stage.boulder-7,by-15,14,6,'#dedbd0');drawRect(stage.boulder+3,by+8,11,7,'#6b6d75');drawText('SUMMIT',812,215,13,'#fff0d0')}
if(level===5){drawMachine(702,'#9bf4ab','GIBBS REACTOR');drawText(`T = ${stage.temperature} K`,702,270,17,'#d5ffe2');const dg=30-stage.temperature*.12;drawText(`ΔG = ${dg>=0?'+':''}${dg.toFixed(0)} kJ`,702,294,17,dg<0?'#9ffbb7':'#ffd098');drawText('ΔH = +30 kJ     ΔS = +0.120 kJ/K',532,237,11,'#e7fbed')}
if(level===6){[[435,'ENERGY'],[595,'ENTROPY'],[735,'ΔG CORE']].forEach(([x,name],i)=>{drawMachine(x,i<stage.finalStep?'#9afed1':'#b5a0e5',name);if(i<stage.finalStep)drawText('✓',x,C.floor-116,22,'#bdffb4')})}}
function drawFX(){for(const p of particles){drawRect(p.x,p.y,5,5,p.color);p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--}particles=particles.filter(p=>p.life>0)}
function drawGame(){drawSky();drawGround();drawLevelObjects();pickups.forEach(drawCoin);drawPortal();drawTinyFlux(player.x,player.y,levels[level].suit,1,player.dir);drawPip(player.x-36,player.y-43);drawFX();if(!stage.done){let xx=level===2?660:level===4?stage.boulder:level===6?[435,595,735][stage.finalStep]:level===5?700:level===3?705:735;if(Math.abs(player.x-xx)<104){drawRect(xx-32,C.floor-148,67,24,'#fcdf93');drawText('E / ACT',xx,C.floor-131,13,'#233047')}}}
function tickPlayer(){const moving=controls.right- controls.left;player.vx=moving*C.move;if(moving)player.dir=moving;player.x=Math.max(24,Math.min(940,player.x+player.vx));if(controls.jump&&player.onGround){player.vy=C.jump;player.onGround=false;beep(400,.06)}if(!player.onGround){const prevBottom=player.y;player.vy+=C.gravity;player.y+=player.vy;if(player.vy>=0){const blocks=[{x:290,y:364,w:125},{x:530,y:345,w:128}];let landed=false;for(const b of blocks){if(prevBottom<=b.y+3&&player.y>=b.y&&player.x+13>b.x&&player.x-13<b.x+b.w){player.y=b.y;player.vy=0;player.onGround=true;landed=true;break}}if(!landed&&player.y>=C.floor){player.y=C.floor;player.vy=0;player.onGround=true}}}else{if(player.y<C.floor){const support=[{x:290,y:364,w:125},{x:530,y:345,w:128}].some(b=>Math.abs(player.y-b.y)<3&&player.x+13>b.x&&player.x-13<b.x+b.w);if(!support)player.onGround=false}}
for(const p of pickups){if(!p.taken&&Math.abs(player.x-p.x)<24&&Math.abs((player.y-16)-p.y)<40){p.taken=true;stage.energy++;beep(840+stage.energy*60,.12);burst(p.x,p.y,'#ffe69f',10);toast(`SPARK COLLECTED! ${stage.energy}/3`);updateHUD()}}
if(level===4&&!stage.done&&stage.boulder>525){if(stage.rollTimer>0)stage.rollTimer--;else stage.boulder=Math.max(525,stage.boulder-.14);if(ticks%50===0)updateHUD()}
if(player.x>=857){if(stage.done){finishLevel();return}else if(!portalHint){portalHint=true;toast('PORTAL LOCKED! Finish the thermodynamics puzzle first.')}}else portalHint=false;
}
function animate(t){requestAnimationFrame(animate);const dt=Math.min(50,t-last);last=t;ticks++;ctx.clearRect(0,0,960,540);if(screen==='play'){if(!dialogue){tickPlayer()}drawGame()}else drawMenuBackdrop();if(dialogue&&dt>0){const txt=dialogue.lines[dialogue.index][1];if(dialogue.shown<txt.length){dialogueTimer+=dt;if(dialogueTimer>19){dialogue.shown=Math.min(txt.length,dialogue.shown+Math.max(1,Math.floor(dialogueTimer/20)));dialogueTimer=0;renderSpeech()}}}if(toastTimer>0){toastTimer--;if(toastTimer===0)$('toast').classList.add('hidden')}}
$('overlay').addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-level]');if(!b)return;beep(500,.06);if(b.hasAttribute('data-level')){startLevel(+b.dataset.level);return}switch(b.dataset.act){case 'new':save=freshSave();store();startLevel(0);break;case 'continue':continueGame();break;case 'menu':showMenu();break;case 'map':showMap();break;case 'about':showAbout();break;case 'settings':showSettings();break;case 'journal':showJournal();break;case 'sound':save.sound=!save.sound;store();showSettings();break;case 'next':startLevel(Math.min(level+1,6));break;case 'reset':if(confirm('Erase all saved progress in this browser?')){save=freshSave();store();showSettings()}break;}});
$('pauseBtn').addEventListener('click',()=>showMap());$('speech').addEventListener('click',advanceSpeech);
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump'};
window.addEventListener('keydown',e=>{if(keyMap[e.code]){if(screen==='play'){e.preventDefault();controls[keyMap[e.code]]=true}}if((e.code==='KeyE'||e.code==='Enter')&&!e.repeat){if(dialogue)advanceSpeech();else action()}if(e.code==='Escape'){if(dialogue)advanceSpeech();else if(screen==='play')showMap();else showMenu()}});
window.addEventListener('keyup',e=>{if(keyMap[e.code])controls[keyMap[e.code]]=false});window.addEventListener('blur',()=>{controls.left=false;controls.right=false;controls.jump=false});
for(const b of document.querySelectorAll('[data-control]')){let name=b.dataset.control;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('held');if(name==='action'){if(dialogue)advanceSpeech();else action()}else controls[name]=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{b.classList.remove('held');if(name!=='action')controls[name]=false})}
showMenu();requestAnimationFrame(animate);
</script></body></html>
